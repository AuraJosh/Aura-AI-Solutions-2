<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Aura AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-03MPB9XG9B"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-03MPB9XG9B');
    </script>
    <style>
        /* Basic styling for custom message box */
        .message-box {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            color: white;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .message-box.info { background-color: #3B82F6; /* blue-500 */ }
        .message-box.error { background-color: #EF4444; /* red-500 */ }
        .message-box.success { background-color: #22C55E; /* green-500 */ }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-8 bg-gray-800 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Sign In</h2>
        <form id="login-form">
            <input type="email" placeholder="Email" class="w-full p-3 mb-4 bg-gray-700 rounded" required />
            <input type="password" placeholder="Password" class="w-full p-3 mb-4 bg-gray-700 rounded" required />
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-semibold">Sign In</button>
        </form>
        <div class="flex justify-between mt-4 text-sm">
            <button onclick="showSignUp()" class="text-blue-400 hover:underline">Sign Up</button>
        </div>
        <p id="error-message" class="text-red-400 text-center mt-4"></p>
    </div>

    <template id="signup-template">
        <div class="w-full max-w-md p-8 bg-gray-800 rounded-xl shadow-md">
            <h2 class="text-2xl font-bold mb-6 text-center">Sign Up</h2>
            <form id="signup-form">
                <input type="email" placeholder="Email" class="w-full p-3 mb-4 bg-gray-700 rounded" required />
                <input type="password" placeholder="Password" class="w-full p-3 mb-4 bg-gray-700 rounded" required />
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 p-3 rounded font-semibold">Sign Up</button>
            </form>
            <div class="mt-4 text-sm text-center">
                <button onclick="location.reload()" class="text-blue-400 hover:underline">Back to Sign In</button>
            </div>
            <p id="signup-error-message" class="text-red-400 text-center mt-4"></p>
        </div>
    </template>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwfckZ8iU2XuHqOV-Yp4RG4D9Jwjsw-P8",
            authDomain: "aura-ai-85b65.firebaseapp.com",
            projectId: "aura-ai-85b65",
            storageBucket: "aura-ai-85b65.appspot.com",
            messagingSenderId: "492492484793",
            appId: "1:492492484793:web:7f9038d50f523241536b68"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- Custom Message Function (replaces alert) ---
        function showMessage(message, type = 'info') {
            const messageBox = document.createElement('div');
            messageBox.className = `message-box ${type}`;
            messageBox.textContent = message;
            document.body.appendChild(messageBox);
            setTimeout(() => {
                messageBox.remove();
            }, 3000); // Remove after 3 seconds
        }

        // --- IMPORTANT: Check auth state on page load ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is already logged in, redirect them away from the login page
                console.log("User already logged in, redirecting to analytics.html");
                window.location.href = "analytics.html"; // Or your main dashboard page
            }
            // If user is null, it means they are not logged in, so they stay on the login page.
        });

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = e.target.querySelector('input[type="email"]').value;
            const password = e.target.querySelector('input[type="password"]').value;
            const errorMessageElement = document.getElementById('error-message');
            errorMessageElement.textContent = ''; // Clear previous errors

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // The onAuthStateChanged listener above will handle the redirect
                // No explicit window.location.href here to avoid race conditions
            } catch (error) {
                console.error("Login failed:", error.message);
                errorMessageElement.textContent = "Login failed: " + error.message;
                showMessage("Login failed: " + error.message, 'error');
            }
        });

        window.showSignUp = function () {
            const template = document.getElementById("signup-template").content.cloneNode(true);
            document.body.innerHTML = ""; // Clear current content
            document.body.appendChild(template);

            document.getElementById("signup-form").addEventListener("submit", async (e) => {
                e.preventDefault();
                const email = e.target.querySelector('input[type="email"]').value;
                const password = e.target.querySelector('input[type="password"]').value;
                const signupErrorMessageElement = document.getElementById('signup-error-message');
                signupErrorMessageElement.textContent = ''; // Clear previous errors

                try {
                    await createUserWithEmailAndPassword(auth, email, password);
                    showMessage("Account created! You can now log in.", 'success');
                    // After successful signup, redirect back to login form (or login automatically)
                    location.reload(); // Reloads the page, showing the login form again
                } catch (error) {
                    console.error("Sign-up failed:", error.message);
                    signupErrorMessageElement.textContent = "Sign-up failed: " + error.message;
                    showMessage("Sign-up failed: " + error.message, 'error');
                }
            });
        };
    </script>
</body>
</html>
