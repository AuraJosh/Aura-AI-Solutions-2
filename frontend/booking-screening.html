<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Booking Screening</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-03MPB9XG9B"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-03MPB9XG9B');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" href="media/favicon.png" type="image/png">
    <style>
    /* Custom CSS from analytics page (kept for visual consistency, though chat logs not present here) */
    .chat-logs-container {
        display: flex;
        flex-direction: column-reverse; /* Stacks items from bottom to top */
        overflow-y: auto;          /* Enables vertical scrolling */
        height: 240px;             /* Set a fixed height (h-60 in Tailwind is 15rem = 240px) */
        justify-content: flex-start;    /* Aligns content to the start (bottom, due to reverse) */
    }
    .chat-log-message {
        padding-bottom: 8px;
    }
    /* Optional: Add backdrop-filter for a subtle blur effect behind the overlay */
    #loading-overlay {
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px); /* For Safari compatibility */
    }

    /* NEW: Monochrome Geometric Flip Loader CSS - with Triangle */
    .geometric-loader {
        width: 60px; /* w-16 is 64px, adjusting to 60px for exact match */
        aspect-ratio: .5;
        display: grid;
        /* Center the loader visually if its parent uses flexbox like #loading-overlay */
        justify-items: center;  
        align-items: center;
    }
    .geometric-loader::before {
        content: "";
        width: 30%;
        aspect-ratio: 1;
        border-radius: 50%;
        margin: auto auto 0;
        background: #9CA3AF; /* Tailwind gray-400 - light gray/blue-gray */
        animation: l9-0 .5s cubic-bezier(0,800,1,800) infinite;
    }
    .geometric-loader::after {
        content: "";
        width: 100%;
        /* Adjusted aspect-ratio for an equilateral triangle if width is the base */
        /* height = width * sqrt(3) / 2 */
        aspect-ratio: 1 / 0.866; /* approx 1 / (Math.sqrt(3) / 2) */
        margin: 0 auto auto;
        /* Changed clip-path to a downward-pointing triangle */
        clip-path: polygon(50% -50%,100% 50%,50% 150%,0 50%);
        background: #3B82F6; /* Tailwind blue-500 - matches your UI accents */
        animation: l9-1 .5s linear infinite;
    }
    @keyframes l9-0 {
        0%,2%  {translate: 0   0%}
        98%,to {translate: 0 -.2%}
    }
    @keyframes l9-1 {
        0%,5%  {rotate:  0deg}
        95%,to {rotate:-60deg}
    }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen overflow-auto">

    <header class="fixed top-0 w-full bg-[#060d1f] shadow z-20">
        <div class="container mx-auto flex items-center justify-between p-4">
        <div class="container mx-auto flex items-center justify-between p-4 relative">
            <div class="flex items-center space-x-4">
                <div class="relative h-20 w-[150px]">
                    <img src="media/logo-dark.png" alt="Aura AI Logo" class="absolute inset-0 h-full w-full object-contain" />
                </div>
                <span class="text-white text-base">Aura AI Solutions</span>
            </div>
            <h1 class="text-white font-semibold text-lg absolute left-1/2 -translate-x-1/2">Booking Screening</h1>
            <div class="flex items-center space-x-4">
                <a href="analytics.html" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded text-sm transition duration-200">
                    Back to Analytics
                </a>
                <button id="logout-btn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-white text-sm">Logout</button>
            </div>
        </div>
    </header>

    <main class="pt-40 px-4 flex justify-center relative z-10">
        <div id="data-table-container" class="w-full max-w-[1600px] h-[80vh] bg-white/10 backdrop-blur-md py-4 px-10 rounded-xl shadow-lg flex">
            <div class="p-8 rounded-xl shadow-2xl bg-gray-900/70 w-full max-w-2xl h-[fit-content] flex items-center justify-center">
                <div id="booking-screening-display" class="w-full max-w-2xl h-[fit-content] flex flex-col items-center">
                    <h2 class="text-white text-2xl font-semibold mb-4">Booking Requests</h2>
                    <div class="flex items-center justify-between w-full px-4">
                        <button id="prev-booking-btn" class="text-white text-5xl p-2 rounded-full hover:bg-white/10 disabled:opacity-30 disabled:cursor-not-allowed transition duration-200">&lt;</button>
                        <div id="booking-card" class="bg-gradient-to-br from-purple-800 to-indigo-900 p-8 rounded-2xl shadow-xl w-full max-w-2xl h-[450px] overflow-y-auto flex flex-col justify-start items-start">
                            <p class="text-white text-center w-full">Loading booking requests...</p>
                        </div>
                        <button id="next-booking-btn" class="text-white text-5xl p-2 rounded-full hover:bg-white/10 disabled:opacity-30 disabled:cursor-not-allowed transition duration-200">&gt;</button>
                    </div>
                    <div id="card-counter" class="text-gray-400 mt-4 text-sm"></div>
                    <div class="flex justify-center space-x-4 mt-4 w-full">
                        <button id="move-to-pending-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg text-base font-semibold transition duration-200 flex-1">
                            Move booking to pending
                        </button>
                        <button id="delete-booking-btn" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg text-base font-semibold transition duration-200 flex-1">
                            Delete booking
                        </button>
                    </div>
                     <button id="save-changes-btn" class="mt-6 bg-green-600 hover:bg-green-700 text-white px-8 py-4 rounded-lg text-lg font-bold transition duration-220 w-full">
                        Save Changes to Sheet
                    </button>
                </div>
            </div>

            <div class="flex flex-col w-full ml-8 space-y-8">
                <div class="flex-1 p-8 rounded-xl shadow-2xl bg-gray-900/70 flex flex-col justify-center items-center">
                    <h2 class="text-white text-2xl font-semibold mb-4">Pending Bookings</h2>
                    <div id="pending-bookings-list" class="bg-gradient-to-br from-blue-800 to-cyan-900 p-8 rounded-2xl shadow-xl w-full h-[200px] overflow-y-auto flex flex-col justify-start items-start space-y-2">
                        <p class="text-white text-center w-full">No pending bookings.</p>
                    </div>
                </div>

                <div class="flex-1 p-8 rounded-xl shadow-2xl bg-gray-900/70 flex flex-col justify-center items-center">
                    <h2 class="text-white text-2xl font-semibold mb-4">Deleted Bookings</h2>
                    <div id="deleted-bookings-list" class="bg-gradient-to-br from-red-800 to-orange-900 p-8 rounded-2xl shadow-xl w-full h-[200px] overflow-y-auto flex flex-col justify-start items-start space-y-2">
                        <p class="text-white text-center w-full">No deleted bookings.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="update-info-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-lg relative">
            <button id="close-modal-btn" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
            <h2 class="text-2xl font-semibold text-white mb-6 text-center">Request Business Info Update</h2>
            <form id="business-info-form">
                <div class="mb-4">
                    <label for="update-details" class="block text-gray-300 text-sm font-bold mb-2">
                        Please describe the changes you would like to make to your AI's business information:
                    </label>
                    <textarea id="update-details" name="updateDetails" rows="8"
                                     class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-900 leading-tight focus:outline-none focus:shadow-outline bg-gray-700 border-gray-600 focus:ring focus:ring-blue-500/50"
                                     placeholder="e.g., 'Update our company address to 123 Main St.', 'Add new service: Product Consulting', 'Remove old contact email: old@example.com'" required></textarea>
                </div>
                <div class="flex items-center justify-between">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-5 rounded focus:outline-none focus:shadow-outline transition duration-300">
                        Send Update Request
                    </button>
                    <p id="form-message" class="text-sm text-gray-400"></p>
                </div>
            </form>
        </div>
    </div>

    <div class="fixed inset-0 -z-10 pointer-events-none">
        <video autoplay loop muted class="w-full h-full object-cover pointer-events-none">
            <source src="media/background.mp4" type="video/mp4" />
            Your browser does not support the video tag.
            <img src="media/fallback.jpg" alt="Background" class="absolute inset-0 w-full h-full object-cover block" />
        </video>
        <div class="absolute inset-0 bg-black/60"></div>
    </div>

    <div id="loading-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-[100] hidden">
        <div class="flex flex-col items-center">
            <div id="loading-spinner" class="geometric-loader mb-4"></div>
            <p id="loading-message" class="text-white text-lg font-semibold"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAwfckZ8iU2XuHqOV-Yp4RG4D9Jwjsw-P8",
            authDomain: "aura-ai-85b65.firebaseapp.com",
            projectId: "aura-ai-85b65",
            storageBucket: "aura-ai-85b65.appspot.com",
            messagingSenderId: "492492484793",
            appId: "1:492492484793:web:7f9038d50f523241536b68"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app); // 'auth' is now defined in this module's scope

        // IMPORTANT: REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL for BOOKING DATA!
        const GOOGLE_APPS_SCRIPT_BOOKING_URL = 'https://script.google.com/macros/s/AKfycbxAxByHKyZAx0uGKt4I14yLSk_8zoD5Cm3R3pemJ6lTF4JTgyzsSywUwFSiZTmfc3dE/exec'; // <--- !!! UPDATE THIS LINE !!!

        let bookingsData = [];
        let pendingBookings = [];
        let deletedBookings = [];

        // --- NEW: Arrays to stage changes locally ---
        // Changed from rowIndex to uniqueIdValue
        let stagedChanges = []; // { uniqueIdValue: any, newStatus: string, originalSource?: string }

        let currentBookingIndex = 0;
        let bookingFieldsConfig = [];
        let currentUserUid = null;

        const bookingCardElement = document.getElementById('booking-card');
        const prevButton = document.getElementById('prev-booking-btn');
        const nextButton = document.getElementById('next-booking-btn');
        const cardCounterElement = document.getElementById('card-counter');
        const moveToPendingBtn = document.getElementById('move-to-pending-btn');
        const deleteBookingBtn = document.getElementById('delete-booking-btn');
        const saveChangesBtn = document.getElementById('save-changes-btn');

        const pendingBookingsListElement = document.getElementById('pending-bookings-list');
        const deletedBookingsListElement = document.getElementById('deleted-bookings-list');

        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingSpinner = document.getElementById('loading-spinner');
        const loadingMessage = document.getElementById('loading-message');

        function showLoading(message) {
            loadingMessage.textContent = message;
            loadingOverlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function updateSaveButtonState() {
            saveChangesBtn.disabled = stagedChanges.length === 0;
            if (stagedChanges.length > 0) {
                saveChangesBtn.textContent = `Save Changes to Sheet (${stagedChanges.length})`;
            } else {
                saveChangesBtn.textContent = 'Save Changes to Sheet';
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            currentUserUid = user.uid;
            console.log("Logged-in user ID (Firebase UID):", currentUserUid);

            showLoading("Loading your booking data...");

            try {
                // For GET, userId is sent in URL parameters
                const response = await fetch(`${GOOGLE_APPS_SCRIPT_BOOKING_URL}?userId=${encodeURIComponent(currentUserUid)}`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json();

                if (data.error) {
                    const errorMessage = `Error: ${data.error}`;
                    bookingCardElement.innerHTML = `<p style="color: red; text-align: center; w-full">${errorMessage}</p>`;
                    pendingBookingsListElement.innerHTML = `<p style="color: red; text-align: center; w-full">${errorMessage}</p>`;
                    deletedBookingsListElement.innerHTML = `<p style="color: red; text-align: center; w-full">${errorMessage}</p>`;
                    return;
                }

                if (data.message) {
                    const infoMessage = `<p class="text-gray-400 text-center w-full">${data.message}</p>`;
                    bookingCardElement.innerHTML = infoMessage;
                    pendingBookingsListElement.innerHTML = infoMessage;
                    deletedBookingsListElement.innerHTML = infoMessage;

                    prevButton.disabled = true;
                    nextButton.disabled = true;
                    moveToPendingBtn.disabled = true;
                    deleteBookingBtn.disabled = true;
                    cardCounterElement.textContent = '';
                    updateSaveButtonState();
                    return;
                }

                if (Array.isArray(data.bookings) && Array.isArray(data.pendingBookings) && Array.isArray(data.deletedBookings) && Array.isArray(data.bookingFieldsConfig)) {
                    bookingsData = data.bookings;
                    pendingBookings = data.pendingBookings;
                    deletedBookings = data.deletedBookings;
                    bookingFieldsConfig = data.bookingFieldsConfig;

                    currentBookingIndex = 0;
                    if (bookingsData.length > 0) {
                        currentBookingIndex = Math.min(currentBookingIndex, bookingsData.length - 1);
                    }

                    deletedBookings.forEach(booking => {
                        if (!booking._originalSource) {
                            booking._originalSource = 'requests';
                        }
                    });

                    renderBookingCard();
                    renderPendingBookings();
                    renderDeletedBookings();
                    updateSaveButtonState();
                } else {
                    const errorMessage = '<p class="text-red-400 text-center w-full">Unexpected data format received from booking server. Missing expected booking lists (bookings, pendingBookings, deletedBookings).</p>';
                    bookingCardElement.innerHTML = errorMessage;
                    pendingBookingsListElement.innerHTML = errorMessage;
                    deletedBookingsListElement.innerHTML = errorMessage;
                    console.error("Received unexpected data format:", data);
                }

            } catch (error) {
                console.error('Error fetching initial booking data:', error);
                const fetchErrorMessage = '<p class="text-red-400 text-center w-full">Failed to load booking data. Please check your internet connection or try again later.</p>';
                bookingCardElement.innerHTML = fetchErrorMessage;
                pendingBookingsListElement.innerHTML = fetchErrorMessage;
                deletedBookingsListElement.innerHTML = fetchErrorMessage;
            } finally {
                hideLoading();
            }
        });

        document.getElementById("logout-btn").addEventListener("click", async () => {
            try {
                await signOut(auth);
                window.location.href = "login.html";
            } catch (err) {
                alert("Logout failed: " + err.message);
            }
        });

        async function sendBatchBookingUpdates(updates) {
            if (!currentUserUid) {
                console.error("User not logged in, cannot send update.");
                return { success: false, error: "User not authenticated." };
            }

            if (updates.length === 0) {
                return { success: true, message: "No changes to save." };
            }

            try {
                // For POST, userId is sent in the JSON body, not the URL parameters
                const response = await fetch(GOOGLE_APPS_SCRIPT_BOOKING_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'batchUpdateStatus',
                        userId: currentUserUid,
                        updates: updates // Array of update objects, now containing uniqueIdValue
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }
                return { success: true, message: data.message };
            } catch (error) {
                console.error('Error sending batch booking updates:', error);
                return { success: false, error: "Network error or server issue during save. Please try again." };
            }
        }

        function renderBookingCard() {
            if (bookingsData.length === 0) {
                if (bookingFieldsConfig.length === 0 && bookingsData.length === 0) {
                    bookingCardElement.innerHTML = '<p class="text-gray-400 text-center w-full">No booking requests or sheet found for this account.</p>';
                } else {
                    bookingCardElement.innerHTML = '<p class="text-gray-400 text-center w-full">No new booking requests found for this account.</p>';
                }

                prevButton.disabled = true;
                nextButton.disabled = true;
                moveToPendingBtn.disabled = true;
                deleteBookingBtn.disabled = true;
                cardCounterElement.textContent = '';
                return;
            }

            const currentBooking = bookingsData[currentBookingIndex];
            let cardContentArray = [];

            bookingFieldsConfig.forEach(fieldConfig => {
                const fieldValue = (currentBooking[fieldConfig.field] || 'N/A').toString().trim();
                cardContentArray.push(`<strong style="font-size: 1.1em;">${fieldConfig.question}</strong>: ${fieldValue}`);
            });

            const combinedContent = cardContentArray.join('<br><br>');

            bookingCardElement.innerHTML = `
                <p class="text-white text-base leading-snug my-0 w-full">${combinedContent}</p>
            `;

            updateNavigationButtons();
            cardCounterElement.textContent = `Booking ${currentBookingIndex + 1} of ${bookingsData.length}`;
            moveToPendingBtn.disabled = false;
            deleteBookingBtn.disabled = false;
        }

        function renderShortenedBookingItem(booking, type, indexInList) {
            let displayValues = [];
            for (let i = 0; i < Math.min(bookingFieldsConfig.length, 3); i++) {
                const fieldName = bookingFieldsConfig[i].field;
                let fieldValue = (booking[fieldName] || 'N/A').toString().trim();

                if (fieldName === 'Timestamp' && booking.Timestamp) {
                    // This might need more robust formatting if 'Timestamp' is a Date object and
                    // its string representation differs from what's stored in the sheet.
                    // For now, simple toLocaleDateString() for display is fine.
                    fieldValue = new Date(booking.Timestamp).toLocaleDateString();
                }

                displayValues.push(fieldValue);
            }

            const displayString = displayValues.join(' | ');

            let buttonsHtml = '';
            if (type === 'pending') {
                buttonsHtml = `
                    <button class="ml-4 px-3 py-1 bg-green-600 hover:bg-green-700 rounded-md text-white text-xs" data-index="${indexInList}" data-list-type="pending" data-action="complete">Complete</button>
                    <button class="ml-2 px-3 py-1 bg-red-600 hover:bg-red-700 rounded-md text-white text-xs" data-index="${indexInList}" data-list-type="pending" data-action="delete">Delete</button>
                    <button class="ml-2 px-3 py-1 bg-yellow-600 hover:bg-yellow-700 rounded-md text-white text-xs" data-index="${indexInList}" data-list-type="pending" data-action="undo">Undo</button>
                `;
            } else if (type === 'deleted') {
                buttonsHtml = `
                    <button class="ml-4 px-3 py-1 bg-yellow-600 hover:bg-yellow-700 rounded-md text-white text-xs" data-index="${indexInList}" data-list-type="deleted" data-action="undo">Undo</button>
                `;
            }

            return `
                <div class="bg-white/10 p-3 rounded-lg flex justify-between items-center text-sm">
                    <span class="font-medium">${displayString}</span>
                    <div class="flex items-center"> ${buttonsHtml}
                    </div>
                </div>
            `;
        }

        function renderPendingBookings() {
            if (pendingBookings.length === 0) {
                pendingBookingsListElement.innerHTML = '<p class="text-white text-center w-full">No pending bookings.</p>';
            } else {
                pendingBookingsListElement.innerHTML = pendingBookings.map((booking, index) => renderShortenedBookingItem(booking, 'pending', index)).join('');
                pendingBookingsListElement.querySelectorAll('button[data-action]').forEach(button => {
                    button.addEventListener('click', handleListButtonAction);
                });
            }
        }

        function renderDeletedBookings() {
            if (deletedBookings.length === 0) {
                deletedBookingsListElement.innerHTML = '<p class="text-white text-center w-full">No deleted bookings.</p>';
            } else {
                deletedBookingsListElement.innerHTML = deletedBookings.map((booking, index) => renderShortenedBookingItem(booking, 'deleted', index)).join('');
                deletedBookingsListElement.querySelectorAll('button[data-action]').forEach(button => {
                    button.addEventListener('click', handleListButtonAction);
                });
            }
        }

        function updateNavigationButtons() {
            prevButton.disabled = currentBookingIndex === 0;
            nextButton.disabled = bookingsData.length === 0 || currentBookingIndex === bookingsData.length - 1;
        }

        function showNextCard() {
            if (currentBookingIndex < bookingsData.length - 1) {
                currentBookingIndex++;
                renderBookingCard();
            }
        }

        function showPrevCard() {
            if (currentBookingIndex > 0) {
                currentBookingIndex--;
                renderBookingCard();
            }
        }

        prevButton.addEventListener('click', showPrevCard);
        nextButton.addEventListener('click', showNextCard);

        // --- Core Booking Action Functions (now staging changes) ---
        function moveBookingToPending() {
            if (bookingsData.length === 0) return;

            const bookingToMove = bookingsData[currentBookingIndex];
            
            // Stage the change with uniqueIdValue
            stagedChanges.push({
                uniqueIdValue: bookingToMove._uniqueIdValue, // <--- IMPORTANT: Use _uniqueIdValue here
                newStatus: 'Pending',
                originalSource: 'requests'
            });

            // Update UI locally
            bookingsData.splice(currentBookingIndex, 1);
            pendingBookings.push(bookingToMove);
            adjustCurrentBookingIndex();
            renderBookingCard();
            renderPendingBookings();
            updateSaveButtonState();
            console.log("Staged move to pending for unique ID:", bookingToMove._uniqueIdValue);
        }

        function deleteBooking() {
            if (bookingsData.length === 0) return;

            const bookingToDelete = bookingsData[currentBookingIndex];

            // Stage the change with uniqueIdValue
            stagedChanges.push({
                uniqueIdValue: bookingToDelete._uniqueIdValue, // <--- IMPORTANT: Use _uniqueIdValue here
                newStatus: 'Deleted',
                originalSource: 'requests'
            });

            // Update UI locally
            bookingsData.splice(currentBookingIndex, 1);
            bookingToDelete._originalSource = 'requests';
            deletedBookings.push(bookingToDelete);
            adjustCurrentBookingIndex();
            renderBookingCard();
            renderDeletedBookings();
            updateSaveButtonState();
            console.log("Staged delete for unique ID:", bookingToDelete._uniqueIdValue);
        }

        function adjustCurrentBookingIndex() {
            if (bookingsData.length > 0) {
                if (currentBookingIndex >= bookingsData.length) {
                    currentBookingIndex = bookingsData.length - 1;
                }
            } else {
                currentBookingIndex = 0;
            }
        }

        // Event listeners for the main action buttons
        moveToPendingBtn.addEventListener('click', moveBookingToPending);
        deleteBookingBtn.addEventListener('click', deleteBooking);

        // --- Handlers for buttons within Pending/Deleted lists (now staging changes) ---
        function handleListButtonAction(event) {
            const button = event.target;
            const index = parseInt(button.dataset.index);
            const listType = button.dataset.listType;
            const action = button.dataset.action;

            let bookingToProcess;
            let targetStatus;
            let originalSourceForStaging;

            if (listType === 'pending') {
                bookingToProcess = pendingBookings[index];
                if (action === 'complete') {
                    targetStatus = 'Completed';
                } else if (action === 'delete') {
                    targetStatus = 'Deleted';
                    originalSourceForStaging = 'pending';
                } else if (action === 'undo') {
                    targetStatus = 'New';
                }

                // Stage the change with uniqueIdValue
                stagedChanges.push({
                    uniqueIdValue: bookingToProcess._uniqueIdValue, // <--- IMPORTANT: Use _uniqueIdValue here
                    newStatus: targetStatus,
                    originalSource: originalSourceForStaging
                });

                // Update UI locally
                if (action === 'complete') {
                    pendingBookings.splice(index, 1);
                } else if (action === 'delete') {
                    const [movedBooking] = pendingBookings.splice(index, 1);
                    movedBooking._originalSource = 'pending';
                    deletedBookings.push(movedBooking);
                } else if (action === 'undo') {
                    const [undoneBooking] = pendingBookings.splice(index, 1);
                    bookingsData.push(undoneBooking);
                    if (bookingsData.length > 0) {
                        currentBookingIndex = bookingsData.length - 1;
                    }
                }
                renderBookingCard();
                renderPendingBookings();
                renderDeletedBookings();
                updateSaveButtonState();
                console.log(`Staged ${action} from pending for unique ID:`, bookingToProcess._uniqueIdValue);

            } else if (listType === 'deleted') {
                bookingToProcess = deletedBookings[index];
                if (action === 'undo') {
                    targetStatus = bookingToProcess._originalSource === 'requests' ? 'New' : 'Pending';
                    originalSourceForStaging = bookingToProcess._originalSource;
                }

                // Stage the change with uniqueIdValue
                stagedChanges.push({
                    uniqueIdValue: bookingToProcess._uniqueIdValue, // <--- IMPORTANT: Use _uniqueIdValue here
                    newStatus: targetStatus,
                    originalSource: originalSourceForStaging
                });

                // Update UI locally
                if (action === 'undo') {
                    const [undoneBooking] = deletedBookings.splice(index, 1);
                    if (undoneBooking._originalSource === 'requests') {
                        bookingsData.push(undoneBooking);
                        if (bookingsData.length > 0) {
                            currentBookingIndex = bookingsData.length - 1;
                        }
                        renderBookingCard();
                    } else if (undoneBooking._originalSource === 'pending') {
                        pendingBookings.push(undoneBooking);
                        renderPendingBookings();
                    }
                }
                renderDeletedBookings();
                updateSaveButtonState();
                console.log(`Staged undo from deleted for unique ID:`, bookingToProcess._uniqueIdValue);
            }
        }

        // NEW: Save Changes Button Event Listener
        saveChangesBtn.addEventListener('click', async () => {
            if (stagedChanges.length === 0) {
                alert("No changes to save.");
                return;
            }

            const confirmation = confirm(`Are you sure you want to save ${stagedChanges.length} changes to the Google Sheet?`);
            if (!confirmation) {
                return;
            }

            showLoading("Saving changes to Google Sheet...");

            try {
                const result = await sendBatchBookingUpdates(stagedChanges);

                if (result.success) {
                    alert("Changes saved successfully!");
                    stagedChanges = [];
                    updateSaveButtonState();
                    // Optionally, re-fetch all data to ensure local state is perfectly aligned with sheet
                    // window.location.reload(); 
                } else {
                    alert("Failed to save changes: " + result.error);
                }
            } finally {
                hideLoading();
            }
        });

    </script>
</body>
</html>
