    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwfckZ8iU2XuHqOV-Yp4RG4D9Jwjsw-P8",
            authDomain: "aura-ai-85b65.firebaseapp.com",
            projectId: "aura-ai-85b65",
            storageBucket: "aura-ai-85b65.appspot.com",
            messagingSenderId: "492492484793",
            appId: "1:492492484793:web:7f9038d50f523241536b68"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Protect this page
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            }
        });

        // Logout button
        document.getElementById("logout-btn").addEventListener("click", async () => {
            try {
                await signOut(auth);
                window.location.href = "login.html";
            } catch (err) {
                alert("Logout failed: " + err.message);
            }
        });
    </script>
    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";

        // IMPORTANT: REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL for BOOKING DATA!
        const GOOGLE_APPS_SCRIPT_BOOKING_URL = 'https://script.google.com/macros/s/AKfycbxAxByHKyZAx0uGKt4I14yLSk_8zoD5Cm3R3pemJ6lTF4JTgyzsSywUwFSiZTmfc3dE/exec'; // <--- Make sure this URL is correct after your Apps Script redeployment!

        const auth = getAuth();
        let bookingsData = []; // Array to hold all booking records with 'New' status
        let pendingBookings = []; // Array to hold pending booking records
        let deletedBookings = []; // Array to hold deleted booking records

        let currentBookingIndex = 0; // Current index of the displayed booking
        let bookingFieldsConfig = []; // This will now be dynamically loaded from the Apps Script
        let currentUserUid = null; // Store user UID for API calls

        const bookingCardElement = document.getElementById('booking-card');
        const prevButton = document.getElementById('prev-booking-btn');
        const nextButton = document.getElementById('next-booking-btn');
        const cardCounterElement = document.getElementById('card-counter');
        const moveToPendingBtn = document.getElementById('move-to-pending-btn');
        const deleteBookingBtn = document.getElementById('delete-booking-btn');

        const pendingBookingsListElement = document.getElementById('pending-bookings-list');
        const deletedBookingsListElement = document.getElementById('deleted-bookings-list');

        // Helper to send updates to Google Apps Script
        async function sendBookingUpdate(action, bookingId, newStatus = null, originalSource = null) {
            if (!currentUserUid) {
                console.error("User not logged in, cannot send update.");
                return { success: false, error: "User not authenticated." };
            }

            try {
                const response = await fetch(GOOGLE_APPS_SCRIPT_BOOKING_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        action: action,
                        userId: currentUserUid,
                        bookingId: bookingId,
                        newStatus: newStatus,
                        originalSource: originalSource // Used for undoDeleted action in Apps Script
                    }).toString()
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }
                return { success: true, message: data.message };
            } catch (error) {
                console.error('Error sending booking update:', error);
                return { success: false, error: "Network error or server issue. Please try again: " + error.message };
            }
        }


        function renderBookingCard() {
            if (bookingsData.length === 0) {
                if (bookingFieldsConfig.length === 0 && bookingsData.length === 0) {
                    bookingCardElement.innerHTML = '<p class="text-gray-400 text-center w-full">No booking requests or sheet found for this account.</p>';
                } else {
                    bookingCardElement.innerHTML = '<p class="text-gray-400 text-center w-full">No booking requests found for this account.</p>';
                }

                prevButton.disabled = true;
                nextButton.disabled = true;
                moveToPendingBtn.disabled = true;
                deleteBookingBtn.disabled = true;
                cardCounterElement.textContent = '';
                return;
            }

            const currentBooking = bookingsData[currentBookingIndex];
            let cardContentArray = [];

            bookingFieldsConfig.forEach(fieldConfig => {
                const fieldValue = (currentBooking[fieldConfig.field] || 'N/A').toString().trim();
                cardContentArray.push(`<strong style="font-size: 1.1em;">${fieldConfig.question}</strong>: ${fieldValue}`);
            });

            const combinedContent = cardContentArray.join('<br><br>');

            bookingCardElement.innerHTML = `
                <p class="text-white text-base leading-snug my-0 w-full">${combinedContent}</p>
            `;

            updateNavigationButtons();
            cardCounterElement.textContent = `Booking ${currentBookingIndex + 1} of ${bookingsData.length}`;
            moveToPendingBtn.disabled = false;
            deleteBookingBtn.disabled = false;
        }

        // Function to render a shortened booking item for lists
        function renderShortenedBookingItem(booking, type, indexInList) {
            let displayValues = [];
            // Get values from the first 3 fields based on bookingFieldsConfig order
            for (let i = 0; i < Math.min(bookingFieldsConfig.length, 3); i++) {
                const fieldName = bookingFieldsConfig[i].field;
                let fieldValue = (booking[fieldName] || 'N/A').toString().trim();

                // Special handling for Timestamp to format it as a date
                if (fieldName === 'Timestamp' && booking.Timestamp) {
                    fieldValue = new Date(booking.Timestamp).toLocaleDateString();
                }

                displayValues.push(fieldValue);
            }

            const displayString = displayValues.join(' | '); // Joins values with ' | '

            let buttonsHtml = '';
            if (type === 'pending') {
                buttonsHtml = `
                    <button class="ml-4 px-3 py-1 bg-green-600 hover:bg-green-700 rounded-md text-white text-xs" data-index="${indexInList}" data-list-type="pending" data-action="complete">Complete</button>
                    <button class="ml-2 px-3 py-1 bg-red-600 hover:bg-red-700 rounded-md text-white text-xs" data-index="${indexInList}" data-list-type="pending" data-action="delete">Delete</button>
                    <button class="ml-2 px-3 py-1 bg-yellow-600 hover:bg-yellow-700 rounded-md text-white text-xs" data-index="${indexInList}" data-list-type="pending" data-action="undo">Undo</button>
                `;
            } else if (type === 'deleted') {
                buttonsHtml = `
                    <button class="ml-4 px-3 py-1 bg-yellow-600 hover:bg-yellow-700 rounded-md text-white text-xs" data-index="${indexInList}" data-list-type="deleted" data-action="undo">Undo</button>
                `;
            }

            return `
                <div class="bg-white/10 p-3 rounded-lg flex justify-between items-center text-sm">
                    <span class="font-medium">${displayString}</span>
                    <div class="flex items-center"> ${buttonsHtml}
                    </div>
                </div>
            `;
        }

        function renderPendingBookings() {
            if (pendingBookings.length === 0) {
                pendingBookingsListElement.innerHTML = '<p class="text-white text-center w-full">No pending bookings.</p>';
            } else {
                pendingBookingsListElement.innerHTML = pendingBookings.map((booking, index) => renderShortenedBookingItem(booking, 'pending', index)).join('');
                // Attach event listeners after rendering
                pendingBookingsListElement.querySelectorAll('button[data-action]').forEach(button => {
                    button.addEventListener('click', handleListButtonAction);
                });
            }
        }

        function renderDeletedBookings() {
            if (deletedBookings.length === 0) {
                deletedBookingsListElement.innerHTML = '<p class="text-white text-center w-full">No deleted bookings.</p>';
            } else {
                deletedBookingsListElement.innerHTML = deletedBookings.map((booking, index) => renderShortenedBookingItem(booking, 'deleted', index)).join('');
                // Attach event listeners after rendering
                deletedBookingsListElement.querySelectorAll('button[data-action]').forEach(button => {
                    button.addEventListener('click', handleListButtonAction);
                });
            }
        }

        function updateNavigationButtons() {
            prevButton.disabled = currentBookingIndex === 0;
            nextButton.disabled = bookingsData.length === 0 || currentBookingIndex === bookingsData.length - 1;
        }

        function showNextCard() {
            if (currentBookingIndex < bookingsData.length - 1) {
                currentBookingIndex++;
                renderBookingCard();
            }
        }

        function showPrevCard() {
            if (currentBookingIndex > 0) {
                currentBookingIndex--;
                renderBookingCard();
            }
        }

        prevButton.addEventListener('click', showPrevCard);
        nextButton.addEventListener('click', showNextCard);

        // --- Core Booking Action Functions ---
        async function moveBookingToPending() {
            if (bookingsData.length === 0) return;

            const bookingToMove = bookingsData[currentBookingIndex]; // Get the booking (don't splice yet)
            const bookingId = bookingToMove.Timestamp.toString(); // Use Timestamp as ID

            const result = await sendBookingUpdate('updateStatus', bookingId, 'Pending');

            if (result.success) {
                bookingsData.splice(currentBookingIndex, 1); // Now remove from current
                pendingBookings.push(bookingToMove); // Add to pending

                adjustCurrentBookingIndex();
                renderBookingCard();
                renderPendingBookings();
                console.log(result.message); // Log success
            } else {
                alert("Failed to move booking to pending: " + result.error); // Show error to user
            }
        }

        async function deleteBooking() {
            if (bookingsData.length === 0) return;

            const bookingToDelete = bookingsData[currentBookingIndex]; // Get the booking (don't splice yet)
            const bookingId = bookingToDelete.Timestamp.toString(); // Use Timestamp as ID

            // When deleting from 'requests', its previous status was 'New'
            const result = await sendBookingUpdate('updateStatus', bookingId, 'Deleted', 'New'); // <--- Pass 'New' as originalSource

            if (result.success) {
                bookingsData.splice(currentBookingIndex, 1); // Now remove from current
                // No need to add _originalSource here on client, as it will be loaded from sheet on refresh
                deletedBookings.push(bookingToDelete); // Add to deleted

                adjustCurrentBookingIndex();
                renderBookingCard();
                renderDeletedBookings();
                console.log(result.message); // Log success
            } else {
                alert("Failed to delete booking: " + result.error); // Show error to user
            }
        }

        function adjustCurrentBookingIndex() {
             if (bookingsData.length > 0) {
                if (currentBookingIndex >= bookingsData.length) {
                    currentBookingIndex = bookingsData.length - 1;
                }
            } else {
                currentBookingIndex = 0; // Reset index if no bookings left
            }
        }

        // Event listeners for the main action buttons
        moveToPendingBtn.addEventListener('click', moveBookingToPending);
        deleteBookingBtn.addEventListener('click', deleteBooking);

        // --- Handlers for buttons within Pending/Deleted lists ---
        async function handleListButtonAction(event) {
            const button = event.target;
            const index = parseInt(button.dataset.index);
            const listType = button.dataset.listType;
            const action = button.dataset.action;

            let bookingToProcess;
            let bookingId;
            let result;

            if (listType === 'pending') {
                bookingToProcess = pendingBookings[index];
                bookingId = bookingToProcess.Timestamp.toString(); // Use Timestamp as ID

                if (action === 'complete') {
                    result = await sendBookingUpdate('updateStatus', bookingId, 'Completed', 'Pending'); // Original status was 'Pending'

                    if (result.success) {
                        pendingBookings.splice(index, 1); // Remove from pending
                        renderPendingBookings();
                        console.log(result.message);
                    } else {
                        alert("Failed to complete booking: " + result.error);
                    }
                } else if (action === 'delete') {
                    // When deleting from 'pending', its previous status was 'Pending'
                    result = await sendBookingUpdate('updateStatus', bookingId, 'Deleted', 'Pending'); // <--- Pass 'Pending' as originalSource

                    if (result.success) {
                        const [movedBooking] = pendingBookings.splice(index, 1); // Remove from pending
                        // No need to add _originalSource here on client, as it will be loaded from sheet on refresh
                        deletedBookings.push(movedBooking); // Add to deleted
                        renderPendingBookings();
                        renderDeletedBookings();
                        console.log(result.message);
                    } else {
                        alert("Failed to delete booking from pending: " + result.error);
                    }
                } else if (action === 'undo') {
                    // Undo from pending goes back to 'New' requests
                    result = await sendBookingUpdate('updateStatus', bookingId, 'New', 'Pending'); // Undo from pending means it came from 'New'

                    if (result.success) {
                        const [undoneBooking] = pendingBookings.splice(index, 1); // Remove from pending
                        bookingsData.push(undoneBooking); // Add to new requests
                        if (bookingsData.length > 0) {
                            currentBookingIndex = bookingsData.length - 1; // Show the newly re-added item
                        }
                        renderBookingCard();
                        renderPendingBookings();
                        console.log(result.message);
                    } else {
                        alert("Failed to undo booking from pending: " + result.error);
                    }
                }
            } else if (listType === 'deleted') {
                bookingToProcess = deletedBookings[index];
                bookingId = bookingToProcess.Timestamp.toString(); // Use Timestamp as ID

                if (action === 'undo') {
                    // When undoing from deleted, the Apps Script will now read Status_prev itself
                    // We just need to tell it to perform the 'undoDeleted' action
                    result = await sendBookingUpdate('undoDeleted', bookingId); // <--- No need to pass targetStatus or originalSource from client here

                    if (result.success) {
                        const [undoneBooking] = deletedBookings.splice(index, 1); // Remove from deleted

                        // This part needs to re-fetch the booking's actual current status from the server
                        // For a clean solution after persistence, it's often best to re-fetch all data or the specific item.
                        // However, to keep it simple and just rely on the UI lists for now:
                        // The Apps Script now handles setting the right status (New or Pending)
                        // on the sheet based on Status_prev. So, here, we simulate it moving back
                        // to the correct array based on what _originalSource *was* when the client last loaded it.
                        // This assumes _originalSource was set correctly during initial load from the sheet.
                        if (undoneBooking._originalSource === 'requests' || undoneBooking._originalSource === 'New') { // 'New' is the status in sheet
                            bookingsData.push(undoneBooking); // Go back to main requests
                            if (bookingsData.length > 0) {
                                currentBookingIndex = bookingsData.length - 1;
                            }
                            renderBookingCard();
                        } else if (undoneBooking._originalSource === 'pending' || undoneBooking._originalSource === 'Pending') { // 'Pending' is the status in sheet
                            pendingBookings.push(undoneBooking); // Go back to pending
                            renderPendingBookings();
                        }
                        renderDeletedBookings(); // Always re-render deleted after an action
                        console.log(result.message);
                    } else {
                        alert("Failed to undo deleted booking: " + result.error);
                    }
                }
            }
        }


        // --- Initial Data Loading Logic ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid; // Store the UID
                console.log("Logged-in user ID (Firebase UID):", currentUserUid);

                // Initial messages while loading
                bookingCardElement.innerHTML = '<p class="text-white text-center w-full">Loading booking requests...</p>';
                pendingBookingsListElement.innerHTML = '<p class="text-white text-center w-full">Loading pending bookings...</p>';
                deletedBookingsListElement.innerHTML = '<p class="text-white text-center w-full">Loading deleted bookings...</p>';

                try {
                    const response = await fetch(`${GOOGLE_APPS_SCRIPT_BOOKING_URL}?userId=${encodeURIComponent(currentUserUid)}`);

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status} - ${response.statusText}`);
                    }

                    const data = await response.json();

                    if (data.error) {
                        const errorMessage = `Error: ${data.error}`;
                        bookingCardElement.innerHTML = `<p style="color: red; text-align: center; w-full">${errorMessage}</p>`;
                        pendingBookingsListElement.innerHTML = `<p style="color: red; text-align: center; w-full">${errorMessage}</p>`;
                        deletedBookingsListElement.innerHTML = `<p style="color: red; text-align: center; w-full">${errorMessage}</p>`;
                        return;
                    }

                    if (data.message) {
                        // This message implies no sheet or account found
                        const infoMessage = `<p class="text-gray-400 text-center w-full">${data.message}</p>`;
                        bookingCardElement.innerHTML = infoMessage;
                        pendingBookingsListElement.innerHTML = infoMessage;
                        deletedBookingsListElement.innerHTML = infoMessage;
                        
                        // Disable buttons since no data to process
                        prevButton.disabled = true;
                        nextButton.disabled = true;
                        moveToPendingBtn.disabled = true;
                        deleteBookingBtn.disabled = true;
                        cardCounterElement.textContent = '';
                        return;
                    }

                    // *** UPDATED DATA ASSIGNMENT FOR INITIAL LOAD ***
                    if (Array.isArray(data.bookings) && Array.isArray(data.pendingBookings) && Array.isArray(data.deletedBookings) && Array.isArray(data.bookingFieldsConfig)) {
                        bookingsData = data.bookings; // These are your 'New' status bookings
                        pendingBookings = data.pendingBookings;
                        deletedBookings = data.deletedBookings;
                        bookingFieldsConfig = data.bookingFieldsConfig;
                        
                        // Set initial index for main bookings; if no new bookings, default to 0
                        currentBookingIndex = 0; 
                        if (bookingsData.length === 0 && (pendingBookings.length > 0 || deletedBookings.length > 0)) {
                           // If no new bookings, but there are pending/deleted, the main card will just show 'no bookings' message
                           // and the navigation buttons will correctly disable.
                        } else if (bookingsData.length > 0) {
                            // Ensure currentBookingIndex is valid if bookingsData has items
                            currentBookingIndex = Math.min(currentBookingIndex, bookingsData.length - 1);
                        }
                        
                        renderBookingCard();
                        renderPendingBookings();
                        renderDeletedBookings();

                    } else {
                        const errorMessage = '<p class="text-red-400 text-center w-full">Unexpected data format received from booking server. Missing expected booking lists (bookings, pendingBookings, deletedBookings).</p>';
                        bookingCardElement.innerHTML = errorMessage;
                        pendingBookingsListElement.innerHTML = errorMessage;
                        deletedBookingsListElement.innerHTML = errorMessage;
                        console.error("Received unexpected data format:", data);
                    }

                } catch (error) {
                    console.error('Error fetching initial booking data:', error);
                    const fetchErrorMessage = '<p class="text-red-400 text-center w-full">Failed to load booking data. Please check your internet connection or try again later.</p>';
                    bookingCardElement.innerHTML = fetchErrorMessage;
                    pendingBookingsListElement.innerHTML = fetchErrorMessage;
                    deletedBookingsListElement.innerHTML = fetchErrorMessage;
                }

            } else {
                console.log("User is signed out. Redirecting to login.");
            }
        });
    </script>
</body>
</html>
