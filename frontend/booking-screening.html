    <style>
    /* Custom CSS from analytics page (kept for visual consistency, though chat logs not present here) */
    .chat-logs-container {
        display: flex;
        flex-direction: column-reverse; /* Stacks items from bottom to top */
        overflow-y: auto;          /* Enables vertical scrolling */
        height: 240px;             /* Set a fixed height (h-60 in Tailwind is 15rem = 240px) */
        justify-content: flex-start;    /* Aligns content to the start (bottom, due to reverse) */
    }
    .chat-log-message {
        padding-bottom: 8px;
    }
    /* Optional: Add backdrop-filter for a subtle blur effect behind the overlay */
    #loading-overlay {
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px); /* For Safari compatibility */
    }

    .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5); /* Changed from 0.8 to 0.6 for less darkness */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999; /* Ensure it's on top of everything */
    color: white;
    font-size: 1.2rem;
    }
    
    .loader {
        height: 60px;
        aspect-ratio: 2;
        border-bottom: 3px solid #0000;
        background:
            linear-gradient(90deg,#524656 50%,#0000 0)
            -25% 100%/50% 3px repeat-x border-box;
        position: relative;
        animation: l3-0 .75s linear infinite;
        margin-bottom: 20px; /* Space between loader and text */
    }
    .loader:before {
        content: "";
        position: absolute;
        inset: auto 42.5% 0;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #8A2BE2; /* Changed from #CF4647 (red) to #8A2BE2 (BlueViolet/purple) */
        animation: l3-1 .75s cubic-bezier(0,900,1,900) infinite;
    }
    @keyframes l3-0 {
        to {background-position: -125% 100%}
    }
    @keyframes l3-1 {
        0%,2% {bottom: 0%}
        98%,to {bottom:.1%}
    }
    /* Basic styling for custom message box */
    .message-box {
        position: fixed;
        top: 1rem;
        right: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        color: white;
        z-index: 1000;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .message-box.info { background-color: #3B82F6; /* blue-500 */ }
    .message-box.error { background-color: #EF4444; /* red-500 */ }
    .message-box.success { background-color: #22C55E; /* green-500 */ }

    /* Custom calendar styles from user prompt */
    #calendar-grid {
        scrollbar-width: thin;
        scrollbar-color: #4b5563 #1f2937;
    }
    #calendar-grid::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    #calendar-grid::-webkit-scrollbar-track {
        background: #1f2937;
    }
    #calendar-grid::-webkit-scrollbar-thumb {
        background-color: #4b5563;
        border-radius: 4px;
    }

    /* Styles for selected time slots */
    .time-slot.selected {
        background-color: #1D4ED8; /* blue-700 */
        border: 2px solid #3B82F6; /* blue-500 */
    }

    /* NEW: Styles for occupied time slots (single block view) */
    .time-slot.occupied-slot {
        background-color: #8B5CF6; /* Purple-500 - matches your UI accents for booked/scheduled events */
        position: relative; /* Essential for child absolute positioning */
        overflow: hidden; /* Ensure text doesn't spill out */
        display: flex; /* Allow content to align */
        align-items: center; /* Vertically center content */
        justify-content: center; /* Horizontally center content */
        color: white; /* Text color for booked slots */
        cursor: not-allowed !important; /* Indicate it's not clickable */
        border: 1px solid #7C3AED; /* Slightly darker purple border */
        border-radius: 0.5rem;  
    }
    .time-slot.occupied-slot:hover {
        background-color: #7C3AED !important; /* Darken on hover for booked slots */
    }

    /* NEW: Style for past time slots */
    .time-slot.past-slot {
        background-color: #374151; /* gray-700 */
        cursor: not-allowed !important;
        opacity: 0.5;
        border-radius: 0.5rem;
    }
    .day-cell-month-past {
        background-color: #374151; /* gray-700 */
        cursor: not-allowed !important;
        opacity: 0.5;
    }

    /* Event display styles - MODIFIED for single block view */
    .calendar-event {
        /* These styles now define how the event content looks *within* the occupied slot */
        color: white; /* Text color of the event name */
        padding: 2px 4px; /* Small padding for text */
        border-radius: 4px;
        font-size: 0.7rem;
        line-height: 1rem;
        text-align: center; /* Center the event text */
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        /* Position over parent .occupied-slot */
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex; /* For centering text */
        align-items: center;
        justify-content: center;
        z-index: 2; /* Ensure event text is above background */
        background-color: transparent; /* Event itself doesn't have a background anymore */
    }
    /* Specific styling for pending events (text only now, background is handled by parent .occupied-slot) */
    .calendar-event.pending {
        color: #F59E0B; /* Amber-500 text for pending */
        /* background-color: transparent; */ /* Ensure no background for pending event div */
    }
    .time-slot.occupied-slot .calendar-event.pending {
        background-color: #CC8A00; /* Amber-700 for pending occupied slots */
        border: 1px solid #F59E0B; /* Amber-500 border */
        color: white; /* Text color inside pending occupied slot */
    }


    /* NEW: For month view, apply similar styling to the events container for stacking */
    .month-day-events-container {
        display: flex;
        flex-direction: column;
        gap: 2px; /* Consistent gap for stacking multiple small event boxes */
        overflow-y: auto; /* Keep scrolling for too many events */
        flex-grow: 1; /* Allow it to take up available space */
    }

    /* NEW: Styling for individual event boxes in month view (smaller, stacked) */
    .month-day-event-item {
        background-color: #8B5CF6; /* Purple-500 for booked/scheduled events */
        color: white;
        padding: 2px 4px;
        border-radius: 4px;
        font-size: 0.7rem;
        line-height: 1rem;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        z-index: 1;
    }
    .month-day-event-item.pending {
        background-color: #F59E0B; /* Amber-500 for pending events */
    }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, onSnapshot, writeBatch, deleteField, Timestamp, getDocs } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";

        // Firebase Configuration (Using global __firebase_config if available)
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyAwfckZ8iU2XuHqOV-Yp4RG4D9Jwjsw-P8", // Replace with your actual API Key from Firebase Console
            authDomain: "aura-ai-85b65.firebaseapp.com",
            projectId: "aura-ai-85b65",
            storageBucket: "aura-ai-85b65.appspot.com",
            messagingSenderId: "492492484793",
            appId: "1:492492484793:web:7f9038d50f523241536b68"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let bookingsData = []; // 'New' bookings
        let pendingBookings = [];
        let deletedBookings = [];
        let stagedChanges = []; // For 'Pending' and 'Deleted' actions that need explicit save
        let currentBookingIndex = 0;
        let currentUserUid = null;
        let currentAccountId = null;
        let authInitialized = false; // Flag to track if auth state is resolved

        const bookingCardElement = document.getElementById('booking-card');
        const prevButton = document.getElementById('prev-booking-btn');
        const nextButton = document.getElementById('next-booking-btn');
        const cardCounterElement = document.getElementById('card-counter');
        const moveToPendingBtn = document.getElementById('move-to-pending-btn');
        const deleteBookingBtn = document.getElementById('delete-booking-btn');
        const saveChangesBtn = document.getElementById('save-changes-btn');

        const pendingBookingsListElement = document.getElementById('pending-bookings-list');
        const deletedBookingsListElement = document.getElementById('deleted-bookings-list');

        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingSpinner = document.getElementById('loading-spinner');
        const loadingMessage = document.getElementById('loading-message');

        // Custom Calendar Elements
        const calendarOverlay = document.getElementById('calendar-overlay');
        const calendarGrid = document.getElementById('calendar-grid');
        const calendarTitle = document.getElementById('calendar-title');
        const calendarPrev = document.getElementById('calendar-prev');
        const calendarNext = document.getElementById('calendar-next');
        const calendarToday = document.getElementById('calendar-today');
        const calendarViewSelect = document.getElementById('calendar-view'); // Renamed to avoid conflict
        const calendarClose = document.getElementById('calendar-close');
        const confirmScheduleBtn = document.getElementById('confirm-schedule-btn');
        const clientAvailableTimesElement = document.getElementById('client-available-times'); // NEW: Client availability element


        let currentDate = new Date();
        let currentView = 'month'; // Default view
        let selectedEventDate = null; // To store the date/time chosen by the user
        let currentBookingBeingScheduled = null; // To store the booking object when the modal is opened
        let fetchedCalendarEvents = []; // Cache for events fetched from Firebase


        function showLoading(message) {
            loadingMessage.textContent = message;
            loadingOverlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function updateSaveButtonState() {
            saveChangesBtn.disabled = stagedChanges.length === 0;
            if (stagedChanges.length > 0) {
                saveChangesBtn.textContent = `Save Changes (${stagedChanges.length})`;
            } else {
                saveChangesBtn.textContent = 'Save Changes to Database';
            }
            console.log("updateSaveButtonState called. stagedChanges length:", stagedChanges.length);
        }

        function showMessage(message, type = 'info') {
            const messageBox = document.createElement('div');
            messageBox.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg text-white z-[101]`;
            if (type === 'error') {
                messageBox.classList.add('bg-red-600');
            } else if (type === 'success') {
                messageBox.classList.add('bg-green-600');
            } else {
                messageBox.classList.add('bg-blue-600');
            }
            messageBox.textContent = message;
            document.body.appendChild(messageBox);
            setTimeout(() => {
                messageBox.remove();
            }, 3000);
        }

        function showConfirm(message, onConfirm, onCancel) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-[102]';
            modal.innerHTML = `
                <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-sm text-center">
                    <p class="text-white text-lg mb-6">${message}</p>
                    <div class="flex justify-center space-x-4">
                        <button id="confirm-yes" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg font-semibold transition duration-200">Yes</button>
                        <button id="confirm-no" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg font-semibold transition duration-200">No</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('confirm-yes').onclick = () => {
                modal.remove();
                onConfirm();
            };
            document.getElementById('confirm-no').onclick = () => {
                modal.remove();
                onCancel();
            };
        }

        // NEW: Helper function to check if a date/time is in the past
        function isPastTime(date) {
            const now = new Date();
            // Compare the date/time objects directly
            return date < now;
        }

        // --- CUSTOM CALENDAR LOGIC ---

        // Function to fetch calendar events from Firebase
        async function fetchCalendarEvents(startDate, endDate) {
            if (!currentAccountId) {
                console.warn("Account ID not available for fetching calendar events.");
                return [];
            }
            try {
                const events = [];
                const bookingsRef = collection(db, 'accounts', currentAccountId, 'bookings');
                const scheduledMeetingsRef = collection(db, 'accounts', currentAccountId, 'scheduled_meetings'); // New collection for scheduled meetings

                // Query for 'Completed' meetings from scheduled_meetings collection (Primary source for completed)
                const qScheduledMeetings = query(scheduledMeetingsRef,
                    where('Status', '==', 'Completed'), // Assuming scheduled_meetings also have a 'Status' field
                    where('ScheduledDateTime', '>=', Timestamp.fromDate(startDate)),
                    where('ScheduledDateTime', '<=', Timestamp.fromDate(endDate))
                );
                const querySnapshotScheduledMeetings = await getDocs(qScheduledMeetings);
                querySnapshotScheduledMeetings.docs.forEach(doc => {
                    const data = doc.data();
                    if (data.ScheduledDateTime && data.ScheduledDateTime.toDate) {
                        events.push({
                            title: data.Phone_Number || data.Customer_Name || data.Email || 'Scheduled',
                            start: data.ScheduledDateTime.toDate(),
                            end: new Date(data.ScheduledDateTime.toDate().getTime() + 60 * 60 * 1000), // Assume 1 hour default
                            type: 'completed', // Use same completed style
                            originalData: data // Pass the full data object for detailed tooltip
                        });
                    }
                });

                // Query for 'Pending' bookings from bookings collection (only pending status, as completed are now in scheduled_meetings)
                const qPending = query(bookingsRef,
                    where('Status', '==', 'Pending'),
                    where('ScheduledDateTime', '>=', Timestamp.fromDate(startDate)), // Include if Pending bookings can have a scheduled time in calendar
                    where('ScheduledDateTime', '<=', Timestamp.fromDate(endDate))
                );
                const querySnapshotPending = await getDocs(qPending);
                querySnapshotPending.docs.forEach(doc => {
                    const data = doc.data();
                    if (data.ScheduledDateTime && data.ScheduledDateTime.toDate) {
                        events.push({
                            title: data.Phone_Number || data.Customer_Name || data.Email || 'Pending',
                            start: data.ScheduledDateTime.toDate(),

            if (currentView === 'month') {
                const year = currentDate.getFullYear();

                startOfWeek.setHours(0, 0, 0, 0);

                fetchEndDate = endOfWeek;

                    ${startOfWeek.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} -

                `;
                fetchedCalendarEvents = await fetchCalendarEvents(fetchStartDate, fetchEndDate); // Fetch events for the whole week
                renderWeekView(fetchStartDate, fetchEndDate);
            } else { // Day View
                const startOfDay = new Date(currentDate);
                startOfDay.setHours(0, 0, 0, 0);
                const endOfDay = new Date(currentDate);
                endOfDay.setHours(23, 59, 59, 999);

                fetchStartDate = startOfDay;
                fetchEndDate = endOfDay;

                calendarTitle.textContent = currentDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
                fetchedCalendarEvents = await fetchCalendarEvents(fetchStartDate, fetchEndDate); // Fetch events for the whole day
                renderDayView(fetchStartDate, fetchEndDate);
            }

        function renderMonthView(fetchStartDate, fetchEndDate) {
            const currentDayMs = new Date().setHours(0,0,0,0);
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDayOfMonth = new Date(year, month, 1).getDay(); // 0 for Sunday, 1 for Monday, etc.
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            // Create header with day names
            const headerRow = document.createElement('div');
            headerRow.className = 'grid grid-cols-7 gap-1 mb-1';
            ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'text-center text-gray-400 text-sm font-medium py-2';
                dayHeader.textContent = day;
                headerRow.appendChild(dayHeader);
            });
            calendarGrid.appendChild(headerRow);

            let dayCounter = 1;
            let nextMonthDayCounter = 1;

            for (let i = 0; i < 6; i++) { // Max 6 weeks in a month view
                const weekRow = document.createElement('div');
                weekRow.className = 'grid grid-cols-7 gap-1';

                for (let j = 0; j < 7; j++) {
                    const dayCell = document.createElement('div');
                    dayCell.className = 'h-24 border border-gray-700 rounded p-1 overflow-hidden flex flex-col relative group';
                    const dateNumDiv = document.createElement('div');
                    dateNumDiv.className = 'text-right font-medium mb-1';
                    
                    let cellDate; // Date object for this specific cell

                    if (i === 0 && j < firstDayOfMonth) {
                        // Days from previous month
                        const prevMonthDay = daysInPrevMonth - (firstDayOfMonth - j - 1);
                        dateNumDiv.textContent = prevMonthDay;
                        dayCell.classList.add('bg-gray-900/50', 'text-gray-600');
                        cellDate = new Date(year, month - 1, prevMonthDay);
                    } else if (dayCounter > daysInMonth) {
                        // Days from next month
                        dateNumDiv.textContent = nextMonthDayCounter;
                        dayCell.classList.add('bg-gray-900/50', 'text-gray-600');
                        cellDate = new Date(year, month + 1, nextMonthDayCounter);
                        nextMonthDayCounter++;
                    } else {
                        // Current month days
                        dateNumDiv.textContent = dayCounter;
                        cellDate = new Date(year, month, dayCounter);

                        if (cellDate.setHours(0,0,0,0) === currentDayMs) {
                            dayCell.classList.add('border-blue-500', 'border-2'); // Highlight today
                        }
                        
                        // NEW: Disable past days in month view
                        if (isPastTime(cellDate)) {
                            dayCell.classList.add('day-cell-month-past');
                        } else {
                            // Add click listener for selection in month view (selecting a whole day)
                            dayCell.dataset.date = cellDate.toISOString(); // Store full date for selection

                                // Select this day
                                selectedEventDate = new Date(e.currentTarget.dataset.date);
                                // Default to a sensible time, perhaps start of day, or current time
                                selectedEventDate.setHours(new Date().getHours(), new Date().getMinutes(), 0, 0); 
                                confirmScheduleBtn.disabled = false;
                                // --- MODIFIED LINE: Added .selected class ---
                                e.currentTarget.classList.add('day-cell-month-selected', 'selected'); // Add a class for month selection
                                showMessage(`Selected: ${selectedEventDate.toLocaleDateString()} (click time slot for specific hour)`, 'info');
                                console.log("Selected month view date:", selectedEventDate);
                            });
                        }
                        
                        dayCounter++;
                    }
                    
                    dayCell.appendChild(dateNumDiv);
                    
                    const eventsContainer = document.createElement('div');
                    // MODIFIED: Added month-day-events-container class for gap styling
                    eventsContainer.className = 'text-xs overflow-y-auto h-16 month-day-events-container';
                    
                    // Add events for this cell's date

        async function initializeBookingData() {
            showLoading("Finding your account...");

            try {
                const userMappingDocRef = doc(db, 'user_mappings', currentUserUid);
                const userMappingSnap = await getDoc(userMappingDocRef);

                if (!userMappingSnap.exists()) {
                    const errorMessage = `No account mapping found for your user ID: ${currentUserUid}. Please contact support.`;
                    bookingCardElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    pendingBookingsListElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    deletedBookingsListElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    hideLoading();
                    return;
                }

                currentAccountId = userMappingSnap.data().accountId;
                console.log("Mapped Account ID:", currentAccountId);

                if (!currentAccountId) {
                    const errorMessage = `Account ID not found in mapping for user ID: ${currentUserUid}. Please contact support.`;
                    bookingCardElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    pendingBookingsListElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    deletedBookingsListElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    hideLoading();
                    return;
                }

                showLoading("Loading your booking data...");

                const bookingsCollectionRef = collection(db, 'accounts', currentAccountId, 'bookings');
                onSnapshot(bookingsCollectionRef, (snapshot) => {
                    bookingsData = [];
                    pendingBookings = [];
                    deletedBookings = [];
                                                            
                    snapshot.forEach(doc => {
                        const booking = { id: doc.id, ...doc.data() };
                        const status = booking.Status ? booking.Status.toString().trim() : '';

                        if (status === 'New' || status === '') {
                            bookingsData.push(booking);
                        } else if (status === 'Pending') {
                            pendingBookings.push(booking);
                        } else if (status === 'Deleted') {
                            booking._originalSource = booking._originalSource || 'UNKNOWN'; // Ensure original source is preserved
                            deletedBookings.push(booking);
                        }
                    });

                    bookingsData.sort((a, b) => {
                        const dateA = a.Timestamp && a.Timestamp.toDate ? a.Timestamp.toDate() : (a.Timestamp instanceof Date ? a.Timestamp : new Date(0));
                        const dateB = b.Timestamp && b.Timestamp.toDate ? b.Timestamp.toDate() : (b.Timestamp instanceof Date ? b.Timestamp : new Date(0));
                        return dateA - dateB;
                    });
                    pendingBookings.sort((a, b) => {
                        const dateA = a.Timestamp && a.Timestamp.toDate ? a.Timestamp.toDate() : (a.Timestamp instanceof Date ? a.Timestamp : new Date(0));
                        const dateB = b.Timestamp && b.Timestamp.toDate ? b.Timestamp.toDate() : (b.Timestamp instanceof Date ? b.Timestamp : new Date(0));
                        return dateA - dateB;
                    });
                    deletedBookings.sort((a, b) => {
                        const dateA = a.Timestamp && a.Timestamp.toDate ? a.Timestamp.toDate() : (a.Timestamp instanceof Date ? a.Timestamp : new Date(0));
                        const dateB = b.Timestamp && b.Timestamp.toDate ? b.Timestamp.toDate() : (b.Timestamp instanceof Date ? b.Timestamp : new Date(0));
                        return dateA - dateB;
                    });

                    if (bookingsData.length > 0) {
                        currentBookingIndex = Math.min(currentBookingIndex, bookingsData.length - 1);
                    } else {
                        currentBookingIndex = 0;
                    }

                    renderBookingCard();
                    renderPendingBookings();
                    renderDeletedBookings();
                    updateSaveButtonState();
                    hideLoading();
                    console.log("Booking data updated from Firestore.");
                }, (error) => {
                    console.error("Error listening to bookings:", error);
                    const errorMessage = `<p class="text-red-400 text-center w-full">Failed to load booking data: ${error.message}. Please check security rules or contact support.</p>`;
                    bookingCardElement.innerHTML = errorMessage;
                    pendingBookingsListElement.innerHTML = errorMessage;
                    deletedBookingsListElement.innerHTML = errorMessage;
                    hideLoading();
                });

            } catch (error) {
                console.error('Error during initial setup or data fetch:', error);
                const fetchErrorMessage = `<p class="text-red-400 text-center w-full">Failed to initialize booking data: ${error.message}.</p>`;
                bookingCardElement.innerHTML = fetchErrorMessage;
                pendingBookingsListElement.innerHTML = fetchErrorMessage;
                deletedBookingsListElement.innerHTML = fetchErrorMessage;
                hideLoading();
            }
        }

        async function sendBatchBookingUpdates(updates) {
            if (!currentAccountId) {
                console.error("Account not identified, cannot send update.");
                return { success: false, error: "Account not identified." };
            }

            if (updates.length === 0) {
                return { success: true, message: "No changes to save." };
            }

            const batch = writeBatch(db);

            updates.forEach(change => {
                const bookingDocRef = doc(db, 'accounts', currentAccountId, 'bookings', change.id);
                const updateData = { Status: change.newStatus };

                if (change.newStatus === 'Deleted') {
                    updateData._originalSource = change.originalSource || 'UNKNOWN';
                    updateData.ScheduledDateTime = deleteField(); 
                } else if (change.newStatus === 'Completed') {
                    updateData._originalSource = deleteField(); // Clear original source for completed
                    if (change.scheduledTime) { 
                        updateData.ScheduledDateTime = Timestamp.fromDate(change.scheduledTime);
                    } else {
                        updateData.ScheduledDateTime = deleteField();
                    }

                    // --- NEW LOGIC FOR CREATING SCHEDULED_MEETINGS ENTRY (Pattern B) ---
                    if (change.fullBookingData) { 
                        const scheduledMeetingDocRef = doc(db, 'accounts', currentAccountId, 'scheduled_meetings', change.id); 
                        
                        // Create a copy to avoid modifying the original data reference and ensure cleanliness
                        const meetingData = { ...change.fullBookingData }; 
                        
                        // Set/Override essential fields for the scheduled meeting
                        meetingData.Status = 'Completed'; 
                        meetingData.ScheduledDateTime = Timestamp.fromDate(change.scheduledTime);
                        meetingData.BookedBy = currentUserUid; 
                        meetingData.ScheduledAt = Timestamp.now();

                        // Clean up fields that are not relevant for scheduled_meetings
                        delete meetingData._originalSource; 
                        if (meetingData.Timestamp) {
                            meetingData.BookingRequestTimestamp = meetingData.Timestamp; 
                            delete meetingData.Timestamp;
                        }
                        // Also remove Status and ScheduledDateTime from the booking data if they were explicitly there
                        delete meetingData.Status; 
                        delete meetingData.ScheduledDateTime;

                        batch.set(scheduledMeetingDocRef, meetingData, { merge: true }); // Use set with merge to create or update
                        console.log("Staging new scheduled meeting entry for ID:", change.id, meetingData);
                    }
                    // --- END NEW LOGIC ---

                }
                else { // 'New' or 'Pending'
                    updateData._originalSource = deleteField(); 
                    updateData.ScheduledDateTime = deleteField(); 
                }
                batch.update(bookingDocRef, updateData);
            });

            try {
                await batch.commit();
                return { success: true, message: "Booking statuses updated successfully." };
            } catch (error) {
                console.error('Error committing batch updates:', error);
                return { success: false, error: `Failed to save changes: ${error.message}` };
            }
        }

        /**
         * Converts a field name from `snake_case` or `camelCase` to `Title Case`.
         * @param {string} fieldName 
         * @returns {string} Formatted label.
         */
        function formatFieldNameAsLabel(fieldName) {
            return fieldName
                .replace(/_/g, ' ') // Replace underscores with spaces
                .replace(/([A-Z])/g, ' $1') // Add space before capital letters (for camelCase)
                .trim() // Remove leading/trailing spaces
                .replace(/\b\w/g, l => l.toUpperCase()); // Capitalize first letter of each word
        }

        function renderBookingCard() {
            if (bookingsData.length === 0) {
                bookingCardElement.innerHTML = '<p class="text-gray-400 text-center w-full">No new booking requests found for this account.</p>';
                prevButton.disabled = true;
                nextButton.disabled = true;
                moveToPendingBtn.disabled = true;
                deleteBookingBtn.disabled = true;
                cardCounterElement.textContent = '';
                return;
            }

            const currentBooking = bookingsData[currentBookingIndex];
            let cardContentArray = [];

            // Define fields to explicitly exclude from the display
            const excludedFields = [
                'id', // Firebase document ID
                'Status', // Status is managed internally, not for card display
                '_originalSource', // Internal tracking field
                'ScheduledDateTime' // Excluded as per request
            ];

            // Prioritize certain fields for display order if they exist
            const preferredDisplayOrder = [
                'Customer_Name',
                'Contact_Name', // Explicitly include Contact_Name and prioritize it
                'Email',
                'Phone_Number',
                'Service',
                'Subject',
                'Message',
                'Preferred_Time',
                'Timestamp'
            ];

            // Get all keys from the current booking data
            let allBookingKeys = Object.keys(currentBooking);

            // Filter out excluded fields
            let displayKeys = allBookingKeys.filter(key => !excludedFields.includes(key));

            // Sort keys: prioritize specified order, then alphabetical for the rest
            displayKeys.sort((a, b) => {
                const indexA = preferredDisplayOrder.indexOf(a);
                const indexB = preferredDisplayOrder.indexOf(b);

                if (indexA === -1 && indexB === -1) {
                    return a.localeCompare(b); // Alphabetical for non-prioritized
                }
                if (indexA === -1) return 1; // b comes before a if a is not in priority list
                if (indexB === -1) return -1; // a comes before b if b is not in priority list
                return indexA - indexB; // Order by priority index
            });


            displayKeys.forEach(fieldName => {
                let fieldValue = (currentBooking[fieldName] || 'N/A');

                // Special formatting for Timestamp fields
                if (fieldName === 'Timestamp' && fieldValue) {
                    if (fieldValue.toDate) { // Check if it's a Firestore Timestamp object
                        fieldValue = fieldValue.toDate().toLocaleString();
                    } else if (fieldValue instanceof Date) { // Check if it's a native Date object
                        fieldValue = fieldValue.toLocaleString();
                    } else {
                        fieldValue = fieldValue.toString().trim();
                    }
                } else {
                    // For all other fields, just convert to string and trim
                    fieldValue = fieldValue.toString().trim();
                }
                
                // Only add to display if the value is not 'N/A' or empty after processing
                if (fieldValue !== 'N/A' && fieldValue !== '') {
                    const label = formatFieldNameAsLabel(fieldName);
                    // --- MODIFIED LINE: Changed font-size from 1.1em to 1em ---
                    cardContentArray.push(`<strong style="font-size: 1em;">${label}</strong>: ${fieldValue}`);
                }
            });

            const combinedContent = cardContentArray.join('<br><br>');

            bookingCardElement.innerHTML = `
                <p class="text-white text-base leading-snug my-0 w-full">${combinedContent}</p>
            `;

            updateNavigationButtons();
            cardCounterElement.textContent = `Booking ${currentBookingIndex + 1} of ${bookingsData.length}`;
            moveToPendingBtn.disabled = false;
            deleteBookingBtn.disabled = false;
        }

        function renderShortenedBookingItem(booking, type, indexInList) {
            let displayValues = [];
            // Define fields to explicitly exclude from the shortened display
            const excludedFieldsShort = [
                'id', 
                'Status', 
                '_originalSource',
                'Message', // Message can be long, often excluded from short view
                'Preferred_Time' // Also often long
            ];

            // Prioritize certain fields for display order in shortened view (up to 3 shown)
            const preferredShortDisplayOrder = [
                'Timestamp',
                'Customer_Name',
                'Contact_Name', // Ensure Contact_Name is considered for short display
                'Email',
                'Phone_Number',
                'Subject',
                'Service',
                'ScheduledDateTime'
            ];

            let allBookingKeys = Object.keys(booking);
            let displayKeysShort = allBookingKeys.filter(key => !excludedFieldsShort.includes(key));

            // Sort keys for shortened display
            displayKeysShort.sort((a, b) => {
                const indexA = preferredShortDisplayOrder.indexOf(a);
                const indexB = preferredShortDisplayOrder.indexOf(b);

                if (indexA === -1 && indexB === -1) {
                    return a.localeCompare(b);
                }
                if (indexA === -1) return 1;
                if (indexB === -1) return -1;
                return indexA - indexB;
            });
            
            let displayedCount = 0;
            for (const fieldName of displayKeysShort) {
                if (displayedCount >= 3) break; // Limit to 3 fields

                let fieldValue = (booking[fieldName] || 'N/A');

                // Special formatting for Timestamp fields
                if (fieldName === 'Timestamp' && fieldValue) {
                    if (fieldValue.toDate) {
                        fieldValue = fieldValue.toDate().toLocaleDateString();
                    } else if (fieldValue instanceof Date) {
                        fieldValue = fieldValue.toLocaleDateString();
                    }
                } else if (fieldName === 'ScheduledDateTime' && fieldValue) {
                    // For ScheduledDateTime, display date and time
                    if (fieldValue.toDate) {
                        fieldValue = fieldValue.toDate().toLocaleString();
                    } else if (fieldValue instanceof Date) {
                        fieldValue = fieldValue.toLocaleString();
                    }
                } else {
                    fieldValue = fieldValue.toString().trim();
                }

                if (fieldValue !== 'N/A' && fieldValue !== '') {
                    displayValues.push(fieldValue);
                    displayedCount++;
                }
            }

            const displayString = displayValues.join(' | ');

            let buttonsHtml = '';
            if (type === 'pending') {
                buttonsHtml = `
                    <button class="ml-4 px-3 py-1 bg-green-600 hover:bg-green-700 rounded-md text-white text-xs" data-id="${booking.id}" data-list-type="pending" data-action="complete">Complete</button>
                    <button class="ml-2 px-3 py-1 bg-red-600 hover:bg-red-700 rounded-md text-white text-xs" data-id="${booking.id}" data-list-type="pending" data-action="delete">Delete</button>
                    <button class="ml-2 px-3 py-1 bg-yellow-600 hover:bg-yellow-700 rounded-md text-white text-xs" data-id="${booking.id}" data-list-type="pending" data-action="undo">Undo</button>
                `;
            } else if (type === 'deleted') {
                buttonsHtml = `
                    <button class="ml-4 px-3 py-1 bg-yellow-600 hover:bg-yellow-700 rounded-md text-white text-xs" data-id="${booking.id}" data-list-type="deleted" data-action="undo">Undo</button>
                `;
            }

            return `
                <div class="bg-white/10 p-3 rounded-lg flex justify-between items-center text-sm">
                    <span class="font-medium">${displayString}</span>
                    <div class="flex items-center"> ${buttonsHtml}
                    </div>
                </div>
            `;
        }

        function renderPendingBookings() {
            if (pendingBookings.length === 0) {
                pendingBookingsListElement.innerHTML = '<p class="text-white text-center w-full">No pending bookings.</p>';
            } else {
                pendingBookingsListElement.innerHTML = pendingBookings.map((booking, index) => renderShortenedBookingItem(booking, 'pending', index)).join('');
                // Event listeners are now handled by delegation on the parent
            }
        }

        function renderDeletedBookings() {
            if (deletedBookings.length === 0) {
                deletedBookingsListElement.innerHTML = '<p class="text-white text-center w-full">No deleted bookings.</p>';
            } else {
                deletedBookingsListElement.innerHTML = deletedBookings.map((booking, index) => renderShortenedBookingItem(booking, 'deleted', index)).join('');
                // Event listeners are now handled by delegation on the parent
            }
        }

        function updateNavigationButtons() {
            prevButton.disabled = currentBookingIndex === 0;
            nextButton.disabled = bookingsData.length === 0 || currentBookingIndex === bookingsData.length - 1;
        }

        function showNextCard() {
            if (bookingsData.length === 0) return; // Prevent errors if no bookings
            if (currentBookingIndex < bookingsData.length - 1) {
                currentBookingIndex++;
                renderBookingCard();
            }
        }

        function showPrevCard() {
            if (bookingsData.length === 0) return; // Prevent errors if no bookings
            if (currentBookingIndex > 0) {
                currentBookingIndex--;
                renderBookingCard();
            }
        }

        prevButton.addEventListener('click', showPrevCard);
        nextButton.addEventListener('click', showNextCard);

        function moveBookingToPending() {
            if (bookingsData.length === 0) return;

            const bookingToMove = bookingsData[currentBookingIndex];
            
            const existingStagedIndex = stagedChanges.findIndex(s => s.id === bookingToMove.id);
            if (existingStagedIndex !== -1) {
                stagedChanges[existingStagedIndex].newStatus = 'Pending';
                stagedChanges[existingStagedIndex].originalSource = 'requests';
                delete stagedChanges[existingStagedIndex].scheduledTime; // Clear scheduledTime
            } else {
                stagedChanges.push({
                    id: bookingToMove.id,
                    newStatus: 'Pending',
                    originalSource: 'requests'
                });
            }

            // Update local arrays immediately for UI reflection (will be replaced by Firestore snapshot)
            bookingsData = bookingsData.filter(b => b.id !== bookingToMove.id); // Remove from new
            bookingToMove.Status = 'Pending';
            pendingBookings.push(bookingToMove); // Add to pending
            adjustCurrentBookingIndex();
            renderBookingCard();
            renderPendingBookings();
            updateSaveButtonState();
            console.log("Staged move to pending for booking ID:", bookingToMove.id);
            console.log("Staged Changes after move to pending:", JSON.parse(JSON.stringify(stagedChanges)));
        }

        function deleteBooking() {
            if (bookingsData.length === 0) return;

            const bookingToDelete = bookingsData[currentBookingIndex];

            const existingStagedIndex = stagedChanges.findIndex(s => s.id === bookingToDelete.id);
            if (existingStagedIndex !== -1) {
                stagedChanges[existingStagedIndex].newStatus = 'Deleted';
                stagedChanges[existingStagedIndex].originalSource = 'requests';
                delete stagedChanges[existingStagedIndex].scheduledTime; // Clear scheduledTime
            } else {
                stagedChanges.push({
                    id: bookingToDelete.id,
                    newStatus: 'Deleted',
                    originalSource: 'requests'
                });
            }

            // Update local arrays immediately for UI reflection (will be replaced by Firestore snapshot)
            bookingsData = bookingsData.filter(b => b.id !== bookingToDelete.id); // Remove from new
            bookingToDelete.Status = 'Deleted';
            bookingToDelete._originalSource = 'requests';
            deletedBookings.push(bookingToDelete); // Add to deleted
            adjustCurrentBookingIndex();
            renderBookingCard();
            renderDeletedBookings();
            updateSaveButtonState();
            console.log("Staged delete for booking ID:", bookingToDelete.id);
            console.log("Staged Changes after delete:", JSON.parse(JSON.stringify(stagedChanges)));
        }

        function adjustCurrentBookingIndex() {
            if (bookingsData.length > 0) {
                if (currentBookingIndex >= bookingsData.length) {
                    currentBookingIndex = bookingsData.length - 1;
                }
            } else {
                currentBookingIndex = 0;
            }
        }

        moveToPendingBtn.addEventListener('click', moveBookingToPending);
        deleteBookingBtn.addEventListener('click', deleteBooking);

        // Event delegation for pending and deleted lists
        pendingBookingsListElement.addEventListener('click', handleListButtonAction);
        deletedBookingsListElement.addEventListener('click', handleListButtonAction);

        function handleListButtonAction(event) {
            const button = event.target.closest('button[data-action]'); // Use .closest to handle clicks on child elements of the button
            if (!button) return; // Not a button with data-action

            const bookingId = button.dataset.id;
            const listType = button.dataset.listType;
            const action = button.dataset.action;

            let bookingToProcess;
            let targetStatus;
            let originalSourceForStaging;

            if (listType === 'pending') {
                bookingToProcess = pendingBookings.find(b => b.id === bookingId);
                if (!bookingToProcess) return;

                if (action === 'complete') {
                    openBookingCalendarModal(bookingToProcess);
                    return; // Exit, as calendar modal handles saving for completion
                } else if (action === 'delete') {
                    targetStatus = 'Deleted';
                    originalSourceForStaging = 'pending';
                    pendingBookings = pendingBookings.filter(b => b.id !== bookingId);
                    bookingToProcess.Status = 'Deleted';
                    bookingToProcess._originalSource = 'pending';
                    deletedBookings.push(bookingToProcess);
                } else if (action === 'undo') {
                    targetStatus = 'New';
                    pendingBookings = pendingBookings.filter(b => b.id !== bookingId);
                    bookingToProcess.Status = 'New';
                    // Reset _originalSource if it's going back to 'New' requests
                    delete bookingToProcess._originalSource; 
                    bookingsData.push(bookingToProcess);
                    if (bookingsData.length > 0) {
                        currentBookingIndex = bookingsData.length - 1;
                    }
                }
                
                const existingStagedIndex = stagedChanges.findIndex(s => s.id === bookingToProcess.id);
                if (existingStagedIndex !== -1) {
                    stagedChanges[existingStagedIndex].newStatus = targetStatus;
                    // Only set originalSource if it's for 'Deleted' status, otherwise clear it.
                    if (targetStatus === 'Deleted') {
                        stagedChanges[existingStagedIndex].originalSource = originalSourceForStaging;
                    } else {
                        delete stagedChanges[existingStagedIndex].originalSource;
                    }
                    delete stagedChanges[existingStagedIndex].scheduledTime; // Clear scheduledTime
                } else {
                    stagedChanges.push({
                        id: bookingToProcess.id,
                        newStatus: targetStatus,
                        originalSource: targetStatus === 'Deleted' ? originalSourceForStaging : undefined // Only set if target is Deleted
                    });
                }

            } else if (listType === 'deleted') {
                bookingToProcess = deletedBookings.find(b => b.id === bookingId);
                if (!bookingToProcess) return;

                if (action === 'undo') {
                    targetStatus = bookingToProcess._originalSource === 'requests' ? 'New' : 'Pending';
                    originalSourceForStaging = bookingToProcess._originalSource;

                    deletedBookings = deletedBookings.filter(b => b.id !== bookingId);
                    bookingToProcess.Status = targetStatus;
                    // When undoing a delete, put it back to its _originalSource's list
                    if (originalSourceForStaging === 'requests') {
                        bookingsData.push(bookingToProcess);
                        if (bookingsData.length > 0) {
                            currentBookingIndex = bookingsData.length - 1;
                        }
                    } else if (originalSourceForStaging === 'pending') {
                        pendingBookings.push(bookingToProcess);
                    }
                }
                const existingStagedIndex = stagedChanges.findIndex(s => s.id === bookingToProcess.id);
                if (existingStagedIndex !== -1) {
                    stagedChanges[existingStagedIndex].newStatus = targetStatus;
                    // Restore originalSource for staging purposes if moving back to pending, clear if to new
                    if (targetStatus === 'Pending') {
                        stagedChanges[existingStagedIndex].originalSource = originalSourceForStaging;
                    } else {
                        delete stagedChanges[existingStagedIndex].originalSource;
                    }
                    delete stagedChanges[existingStagedIndex].scheduledTime; // Clear scheduledTime
                } else {
                    stagedChanges.push({
                        id: bookingToProcess.id,
                        newStatus: targetStatus,
                        originalSource: targetStatus === 'Pending' ? originalSourceForStaging : undefined // Only set if target is Pending
                    });
                }
            }

            // These are always called, unless `complete` action which `return`s early
            renderBookingCard();
            renderPendingBookings();
            renderDeletedBookings();
            updateSaveButtonState();
            console.log(`Staged ${action} from ${listType} for booking ID:`, bookingToProcess.id);
            console.log("Staged Changes after list action:", JSON.parse(JSON.stringify(stagedChanges)));
        }

        // MODIFIED: confirmScheduleBtn now calls sendBatchBookingUpdates directly and automatically saves
        confirmScheduleBtn.addEventListener('click', async () => {
            if (selectedEventDate && currentBookingBeingScheduled) {
                showConfirm(`Confirm booking "${currentBookingBeingScheduled.id}" for ${selectedEventDate.toLocaleString()}?`, async () => {
                    showLoading("Completing and saving booking...");

                    try {
                        const bookingId = currentBookingBeingScheduled.id;
                        
                        // Create a single-element array for the batch update
                        const updatesToCommit = [{
                            id: bookingId,
                            newStatus: 'Completed',
                            scheduledTime: selectedEventDate, // This is the Date object
                            fullBookingData: currentBookingBeingScheduled 
                        }];

                        const result = await sendBatchBookingUpdates(updatesToCommit);

                        if (result.success) {
                            showMessage("Booking confirmed and saved successfully!", 'success');
                            // The onSnapshot listener will handle the UI update due to data change in Firestore.
                            // We close the calendar overlay immediately.
                        } else {
                            showMessage("Failed to confirm and save booking: " + result.error, 'error');
                        }
                    } catch (error) {
                        console.error("Error during booking completion:", error);
                        showMessage("An unexpected error occurred during booking completion: " + error.message, 'error');
                    } finally {
                        hideLoading();
                        calendarOverlay.classList.add('hidden');
                        document.body.style.overflow = '';
                        // Re-render calendar to reflect the newly booked slot, relying on Firestore's onSnapshot.
                        // renderCalendar() will be implicitly triggered by the onSnapshot listener if data changes.
                    }
                }, () => {
                    showMessage("Booking confirmation cancelled.", 'info');
                });
            } else {
                showMessage("Please select a date and time for the booking.", 'info');
            }
        });

        saveChangesBtn.addEventListener('click', async () => {
            console.log("Save Changes button clicked!"); // Debug log
            if (stagedChanges.length === 0) {
                showMessage("No changes to save.", 'info');
                return;
            }

            showConfirm(`Are you sure you want to save ${stagedChanges.length} changes to the database?`, async () => {
                showLoading("Saving changes to Database...");

                try {
                    const result = await sendBatchBookingUpdates(stagedChanges);

                    if (result.success) {
                        showMessage("Changes saved successfully!", 'success');
                        stagedChanges = []; // Clear staged changes only upon successful commit
                        updateSaveButtonState(); // Update button state to reflect cleared changes
                    } else {
                        showMessage("Failed to save changes: " + result.error, 'error');
                    }
                } finally {
                    hideLoading();
                }
            }, () => {
                showMessage("Save cancelled.", 'info');
            });
        });

    </script>
