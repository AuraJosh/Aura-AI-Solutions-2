    /* Custom CSS from analytics page (kept for visual consistency, though chat logs not present here) */
    .chat-logs-container {

    /* Optional: Add backdrop-filter for a subtle blur effect behind the overlay */
    #loading-overlay {
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px); /* For Safari compatibility */
    }

    /* Monochrome Geometric Flip Loader CSS */
    .geometric-loader {
        width: 60px; /* w-16 is 64px, adjusting to 60px for exact match */
        aspect-ratio: .5;
        display: grid;
        justify-items: center;  
        align-items: center;
    }
    .geometric-loader::before {
        content: "";
        width: 30%;
        aspect-ratio: 1;
        border-radius: 50%;
        margin: auto auto 0;
        background: #9CA3AF; /* Tailwind gray-400 - light gray/blue-gray */
        animation: l9-0 .5s cubic-bezier(0,800,1,800) infinite;
    }
    .geometric-loader::after {
        content: "";
        width: 100%;
        aspect-ratio: 1 / 0.866;
        margin: 0 auto auto;
        clip-path: polygon(50% -50%,100% 50%,50% 150%,0 50%);
        background: #3B82F6; /* Tailwind blue-500 - matches your UI accents */
        animation: l9-1 .5s linear infinite;
    }
    @keyframes l9-0 {
        0%,2%  {translate: 0   0%}
        98%,to {translate: 0 -.2%}
    }
    @keyframes l9-1 {
        0%,5%  {rotate:  0deg}
        95%,to {rotate:-60deg}
    }
    /* Basic styling for custom message box */
    .message-box {
        position: fixed;
        top: 1rem;
        right: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        color: white;
        z-index: 1000;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .message-box.info { background-color: #3B82F6; /* blue-500 */ }
    .message-box.error { background-color: #EF4444; /* red-500 */ }
    .message-box.success { background-color: #22C55E; /* green-500 */ }

    /* Custom calendar styles from user prompt */
    #calendar-grid {
        scrollbar-width: thin;
        scrollbar-color: #4b5563 #1f2937;
    }
    #calendar-grid::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    #calendar-grid::-webkit-scrollbar-track {
        background: #1f2937;
    }
    #calendar-grid::-webkit-scrollbar-thumb {
        background-color: #4b5563;
        border-radius: 4px;
    }

    /* Styles for selected time slots */
    .time-slot.selected {
        background-color: #1D4ED8; /* blue-700 */
        border: 2px solid #3B82F6; /* blue-500 */
    }

    /* Event display styles - MODIFIED to PURPLE for completed events */
    .calendar-event {
        background-color: #8B5CF6; /* Purple-500 for booked/scheduled events */
        color: white;
        padding: 2px 4px;
        border-radius: 4px;
        font-size: 0.7rem;
        line-height: 1rem;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        position: relative; /* Ensure z-index works */
        z-index: 1; /* Ensure event div is above time-slot background */
        /* Removed margin-bottom (mb-0.5) to allow parent gap to control spacing */
    }
    .calendar-event.pending {
        background-color: #F59E0B; /* amber-500 for pending events (kept as is) */
    }

    /* NEW: Add flex and gap to time-slot for better event stacking */
    .time-slot {
        display: flex;
        flex-direction: column;
        gap: 2px; /* Smaller gap for tighter packing, adjust as needed */
        /* Ensure overflow-hidden is there as it is */
        overflow: hidden; /* Keep this to clip events that don't fit */
    }

    /* NEW: For month view, apply similar styling to the events container */
    .month-day-events-container {
        display: flex;
        flex-direction: column;
        gap: 2px; /* Consistent gap */
        overflow-y: auto; /* Keep scrolling for too many events */
    }

    /* Removed .time-slot-unavailable CSS entirely, as blocked visual is now the event itself */
    </style>

        function showMessage(message, type = 'info') {

        function showConfirm(message, onConfirm, onCancel) {

        // --- CUSTOM CALENDAR LOGIC ---

        // Function to fetch calendar events from Firebase
        async function fetchCalendarEvents(startDate, endDate) {
            if (!currentAccountId) {
                console.warn("Account ID not available for fetching calendar events.");
                return [];
            }
            try {
                const events = [];
                const bookingsRef = collection(db, 'accounts', currentAccountId, 'bookings');
                const scheduledMeetingsRef = collection(db, 'accounts', currentAccountId, 'scheduled_meetings'); // New collection for scheduled meetings

                // Query for 'Completed' bookings within the date range from bookings collection
                const qCompletedBookings = query(bookingsRef,
                    where('Status', '==', 'Completed'),
                    where('ScheduledDateTime', '>=', Timestamp.fromDate(startDate)),
                    where('ScheduledDateTime', '<=', Timestamp.fromDate(endDate))
                );
                const querySnapshotCompletedBookings = await getDocs(qCompletedBookings);
                querySnapshotCompletedBookings.docs.forEach(doc => {
                    const data = doc.data();
                    if (data.ScheduledDateTime && data.ScheduledDateTime.toDate) {
                        events.push({
                            // MODIFIED: Prioritize Phone_Number, then Customer_Name, then Email
                            title: data.Phone_Number || data.Customer_Name || data.Email || 'Booked',
                            start: data.ScheduledDateTime.toDate(),
                            end: new Date(data.ScheduledDateTime.toDate().getTime() + 60 * 60 * 1000), // Assume 1 hour default
                            type: 'completed',
                            originalData: data // Pass the full data object for detailed tooltip
                        });
                    }
                });

                // Query for 'Completed' meetings from scheduled_meetings collection
                const qScheduledMeetings = query(scheduledMeetingsRef,
                    where('Status', '==', 'Completed'), // Assuming scheduled_meetings also have a 'Status' field
                    where('ScheduledDateTime', '>=', Timestamp.fromDate(startDate)),
                    where('ScheduledDateTime', '<=', Timestamp.fromDate(endDate))
                );
                const querySnapshotScheduledMeetings = await getDocs(qScheduledMeetings);
                querySnapshotScheduledMeetings.docs.forEach(doc => {
                    const data = doc.data();
                    if (data.ScheduledDateTime && data.ScheduledDateTime.toDate) {
                        events.push({
                            // MODIFIED: Prioritize Phone_Number, then Customer_Name, then Email
                            title: data.Phone_Number || data.Customer_Name || data.Email || 'Scheduled',
                            start: data.ScheduledDateTime.toDate(),
                            end: new Date(data.ScheduledDateTime.toDate().getTime() + 60 * 60 * 1000), // Assume 1 hour default
                            type: 'completed', // Use same completed style
                            originalData: data // Pass the full data object for detailed tooltip
                        });
                    }
                });


                // Query for 'Pending' bookings that might already have a scheduled time
                const qPending = query(bookingsRef,
                    where('Status', '==', 'Pending'),
                    where('ScheduledDateTime', '>=', Timestamp.fromDate(startDate)),
                    where('ScheduledDateTime', '<=', Timestamp.fromDate(endDate))
                );
                const querySnapshotPending = await getDocs(qPending);
                querySnapshotPending.docs.forEach(doc => {
                    const data = doc.data();
                    if (data.ScheduledDateTime && data.ScheduledDateTime.toDate) {
                        events.push({
                            // MODIFIED: Prioritize Phone_Number, then Customer_Name, then Email
                            title: data.Phone_Number || data.Customer_Name || data.Email || 'Pending',
                            start: data.ScheduledDateTime.toDate(),
                            end: new Date(data.ScheduledDateTime.toDate().getTime() + 60 * 60 * 1000), // Assume 1 hour default
                            type: 'pending',
                            originalData: data // Pass the full data object for detailed tooltip
                        });
                    }
                });
                
                return events;
            } catch (error) {
                console.error("Error fetching calendar events:", error);
                showMessage("Error loading calendar events. Check console for index requirement.", 'error');
                return [];
            }
        }


        function openBookingCalendarModal(bookingData) {
            currentBookingBeingScheduled = bookingData;
            selectedEventDate = null; // Reset selection
            confirmScheduleBtn.disabled = true; // Disable until a time is selected
            calendarOverlay.classList.remove('hidden');

        // This function will fetch events and render the calendar view
        async function renderCalendar() {
            calendarGrid.innerHTML = ''; // Clear previous content
            confirmScheduleBtn.disabled = true; // Disable confirm button on re-render

            let fetchStartDate, fetchEndDate;

            if (currentView === 'month') {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                fetchStartDate = new Date(year, month, 1);
                fetchEndDate = new Date(year, month + 1, 0, 23, 59, 59); // End of month
                calendarTitle.textContent = `${new Intl.DateTimeFormat('en-US', { month: 'long' }).format(currentDate)} ${year}`;
                renderMonthView(fetchStartDate, fetchEndDate);
            } else if (currentView === 'week') {
                const startOfWeek = new Date(currentDate);
                startOfWeek.setDate(currentDate.getDate() - currentDate.getDay()); // Sunday
                startOfWeek.setHours(0, 0, 0, 0);
                
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6); // Saturday
                endOfWeek.setHours(23, 59, 59, 999);

                fetchStartDate = startOfWeek;
                fetchEndDate = endOfWeek;

            const year = currentDate.getFullYear();

            const firstDayOfMonth = new Date(year, month, 1).getDay(); // 0 for Sunday, 1 for Monday, etc.
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            let dayCounter = 1;
            let nextMonthDayCounter = 1;
            let currentDayMs = new Date().setHours(0,0,0,0);

            for (let i = 0; i < 6; i++) { // Max 6 weeks in a month view
                const weekRow = document.createElement('div');
                weekRow.className = 'grid grid-cols-7 gap-1';

                for (let j = 0; j < 7; j++) {
                    const dayCell = document.createElement('div');

                    const dateNumDiv = document.createElement('div');
                    dateNumDiv.className = 'text-right font-medium mb-1';
                    
                    let cellDate; // Date object for this specific cell

                    if (i === 0 && j < firstDayOfMonth) {
                        // Days from previous month
                        const prevMonthDay = daysInPrevMonth - (firstDayOfMonth - j - 1);
                        dateNumDiv.textContent = prevMonthDay;
                        dayCell.classList.add('bg-gray-900/50', 'text-gray-600');
                        cellDate = new Date(year, month - 1, prevMonthDay);
                    } else if (dayCounter > daysInMonth) {
                        // Days from next month
                        dateNumDiv.textContent = nextMonthDayCounter;
                        dayCell.classList.add('bg-gray-900/50', 'text-gray-600');
                        cellDate = new Date(year, month + 1, nextMonthDayCounter);
                        nextMonthDayCounter++;
                    } else {
                        // Current month days
                        dateNumDiv.textContent = dayCounter;
                        cellDate = new Date(year, month, dayCounter);

                        if (cellDate.setHours(0,0,0,0) === currentDayMs) {
                            dayCell.classList.add('border-blue-500', 'border-2'); // Highlight today

                        // Add click listener for selection in month view (selecting a whole day)

        async function initializeBookingData() {
            showLoading("Finding your account...");

            try {
                const userMappingDocRef = doc(db, 'user_mappings', currentUserUid);
                const userMappingSnap = await getDoc(userMappingDocRef);

                if (!userMappingSnap.exists()) {
                    const errorMessage = `No account mapping found for your user ID: ${currentUserUid}. Please contact support.`;
                    bookingCardElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    pendingBookingsListElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    deletedBookingsListElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    hideLoading();
                    return;
                }

                currentAccountId = userMappingSnap.data().accountId;
                console.log("Mapped Account ID:", currentAccountId);

                if (!currentAccountId) {
                    const errorMessage = `Account ID not found in mapping for user ID: ${currentUserUid}. Please contact support.`;
                    bookingCardElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    pendingBookingsListElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    deletedBookingsListElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    hideLoading();
                    return;
                }

                showLoading("Loading your booking data...");

                const bookingsCollectionRef = collection(db, 'accounts', currentAccountId, 'bookings');
                onSnapshot(bookingsCollectionRef, (snapshot) => {
                    bookingsData = [];
                    pendingBookings = [];
                    deletedBookings = [];
                    // bookingFieldsConfig is populated dynamically from first doc, which is fine for display
                                                    
                    snapshot.forEach(doc => {
                        const booking = { id: doc.id, ...doc.data() };
                        const status = booking.Status ? booking.Status.toString().trim() : '';

                        // Populate bookingFieldsConfig only once or from a definitive source
                        if (bookingFieldsConfig.length === 0) {
                             Object.keys(booking).forEach(key => {
                                 if (key !== 'id' && key !== 'Status' && key !== '_originalSource' && key !== 'Timestamp' && key !== 'ScheduledDateTime') {
                                     bookingFieldsConfig.push({ field: key, question: key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) });
                                 }
                             });
                             if (!bookingFieldsConfig.some(f => f.field === 'Timestamp')) {
                                 bookingFieldsConfig.push({ field: 'Timestamp', question: 'Timestamp' });
                             }
                             if (!bookingFieldsConfig.some(f => f.field === 'ScheduledDateTime')) {
                                 bookingFieldsConfig.push({ field: 'ScheduledDateTime', question: 'Scheduled Date/Time' });
                             }
                             if (!bookingFieldsConfig.some(f => f.field === 'Status')) {
                                 bookingFieldsConfig.push({ field: 'Status', question: 'Status' });
                             }
                        }

                        if (status === 'New' || status === '') {
                            bookingsData.push(booking);
                        } else if (status === 'Pending') {
                            pendingBookings.push(booking);
                        } else if (status === 'Deleted') {
                            booking._originalSource = booking._originalSource || 'UNKNOWN'; // Ensure original source is preserved
                            deletedBookings.push(booking);
                        }
                    });

                    bookingsData.sort((a, b) => {
                        const dateA = a.Timestamp && a.Timestamp.toDate ? a.Timestamp.toDate() : (a.Timestamp instanceof Date ? a.Timestamp : new Date(0));
                        const dateB = b.Timestamp && b.Timestamp.toDate ? b.Timestamp.toDate() : (b.Timestamp instanceof Date ? b.Timestamp : new Date(0));
                        return dateA - dateB;
                    });
                    pendingBookings.sort((a, b) => {
                        const dateA = a.Timestamp && a.Timestamp.toDate ? a.Timestamp.toDate() : (a.Timestamp instanceof Date ? a.Timestamp : new Date(0));
                        const dateB = b.Timestamp && b.Timestamp.toDate ? b.Timestamp.toDate() : (b.Timestamp instanceof Date ? b.Timestamp : new Date(0));
                        return dateA - dateB;
                    });
                    deletedBookings.sort((a, b) => {

                        const dateB = b.Timestamp && b.Timestamp.toDate ? b.Timestamp.toDate() : (b.Timestamp instanceof Date ? b.Timestamp : new Date(0));

        async function sendBatchBookingUpdates(updates) {
            if (!currentAccountId) {
                console.error("Account not identified, cannot send update.");
                return { success: false, error: "Account not identified." };
            }

            if (updates.length === 0) {
                return { success: true, message: "No changes to save." };
            }

            const batch = writeBatch(db);

            updates.forEach(change => {
                const bookingDocRef = doc(db, 'accounts', currentAccountId, 'bookings', change.id);
                const updateData = { Status: change.newStatus };

                if (change.newStatus === 'Deleted') {
                    updateData._originalSource = change.originalSource || 'UNKNOWN';
                    updateData.ScheduledDateTime = deleteField(); 
                } else if (change.newStatus === 'Completed') {
                    updateData._originalSource = deleteField(); // Clear original source for completed
                    if (change.scheduledTime) { 
                        updateData.ScheduledDateTime = Timestamp.fromDate(change.scheduledTime);
                    } else {
                        updateData.ScheduledDateTime = deleteField();
                    }

                    // --- NEW LOGIC FOR CREATING SCHEDULED_MEETINGS ENTRY (Pattern B) ---
                    if (change.fullBookingData) { 
                        const scheduledMeetingDocRef = doc(db, 'accounts', currentAccountId, 'scheduled_meetings', change.id); 
                        
                        // Create a copy to avoid modifying the original data reference and ensure cleanliness
                        const meetingData = { ...change.fullBookingData }; 
                        
                        // Set/Override essential fields for the scheduled meeting
                        meetingData.Status = 'Completed'; 
                        meetingData.ScheduledDateTime = Timestamp.fromDate(change.scheduledTime);
                        meetingData.BookedBy = currentUserUid; 
                        meetingData.ScheduledAt = Timestamp.now();

                        // Clean up fields that are not relevant for scheduled_meetings
                        delete meetingData._originalSource; 
                        if (meetingData.Timestamp) {
                            meetingData.BookingRequestTimestamp = meetingData.Timestamp; 
                            delete meetingData.Timestamp;
                        }

                        batch.set(scheduledMeetingDocRef, meetingData, { merge: true }); // Use set with merge to create or update
                        console.log("Staging new scheduled meeting entry for ID:", change.id, meetingData);
                    }
                    // --- END NEW LOGIC ---

                }
                else { // 'New' or 'Pending'
                    updateData._originalSource = deleteField(); 
                    updateData.ScheduledDateTime = deleteField(); 
                }
                batch.update(bookingDocRef, updateData);
            });

            try {
                await batch.commit();
                return { success: true, message: "Booking statuses updated successfully." };
            } catch (error) {
                console.error('Error committing batch updates:', error);
                return { success: false, error: `Failed to save changes: ${error.message}` };
            }
        }

            }


            bookingFieldsConfig.forEach(fieldConfig => {
                let fieldValue = (currentBooking[fieldConfig.field] || 'N/A');

                if ((fieldConfig.field === 'Timestamp' || fieldConfig.field === 'ScheduledDateTime') && fieldValue) {
                    if (fieldValue.toDate) {
                        fieldValue = fieldValue.toDate().toLocaleString();
                    } else if (fieldValue instanceof Date) {
                        fieldValue = fieldValue.toLocaleString();
                    } else {
                        fieldValue = fieldValue.toString().trim();
                    }
                } else {
                    fieldValue = fieldValue.toString().trim();
                }
                cardContentArray.push(`<strong style="font-size: 1.1em;">${fieldConfig.question}</strong>: ${fieldValue}`);
            });

            const combinedContent = cardContentArray.join('<br><br>');

            bookingCardElement.innerHTML = `
                <p class="text-white text-base leading-snug my-0 w-full">${combinedContent}</p>
            `;

            updateNavigationButtons();
            cardCounterElement.textContent = `Booking ${currentBookingIndex + 1} of ${bookingsData.length}`;
            moveToPendingBtn.disabled = false;
            deleteBookingBtn.disabled = false;
        }

        function renderShortenedBookingItem(booking, type, indexInList) {
            let displayValues = [];
            const fieldsToDisplay = ['Timestamp', 'Customer_Name', 'Email', 'Subject', 'Service', 'ScheduledDateTime'];
            let displayedCount = 0;

            for (const fieldName of fieldsToDisplay) {
                if (booking[fieldName] !== undefined && displayedCount < 3) {
                    let fieldValue = (booking[fieldName] || 'N/A');
                    if (fieldName === 'Timestamp' || fieldName === 'ScheduledDateTime') {
                        if (fieldValue && fieldValue.toDate) {
                            fieldValue = fieldValue.toDate().toLocaleDateString();
                        } else if (fieldValue instanceof Date) {
                            fieldValue = fieldValue.toLocaleDateString();
                        } else {
                            fieldValue = fieldValue.toString().trim();
                        }
                    } else {
                        fieldValue = fieldValue.toString().trim();
                    }
                    displayValues.push(fieldValue);
                    displayedCount++;
                }
            }

            if (displayedCount < 3 && bookingFieldsConfig.length > 0) {
                for (let i = 0; i < bookingFieldsConfig.length && displayedCount < 3; i++) {
                    const fieldName = bookingFieldsConfig[i].field;
                    if (!fieldsToDisplay.includes(fieldName) && booking[fieldName] !== undefined) {
                        let fieldValue = (booking[fieldName] || 'N/A');
                        if (fieldName === 'Timestamp' || fieldName === 'ScheduledDateTime') {
                            if (fieldValue && fieldValue.toDate) {
                                fieldValue = fieldValue.toDate().toLocaleDateString();
                            } else if (fieldValue instanceof Date) {
                                fieldValue = fieldValue.toLocaleDateString();
                            } else {
                                fieldValue = fieldValue.toString().trim();
                            }
                        } else {
                            fieldValue = fieldValue.toString().trim();
                        }
                        displayValues.push(fieldValue);
                        displayedCount++;
                    }
                }
            }


            const displayString = displayValues.join(' | ');

            let buttonsHtml = '';
            if (type === 'pending') {
                buttonsHtml = `
                    <button class="ml-4 px-3 py-1 bg-green-600 hover:bg-green-700 rounded-md text-white text-xs" data-id="${booking.id}" data-list-type="pending" data-action="complete">Complete</button>
                    <button class="ml-2 px-3 py-1 bg-red-600 hover:bg-red-700 rounded-md text-white text-xs" data-id="${booking.id}" data-list-type="pending" data-action="delete">Delete</button>
                    <button class="ml-2 px-3 py-1 bg-yellow-600 hover:bg-yellow-700 rounded-md text-white text-xs" data-id="${booking.id}" data-list-type="pending" data-action="undo">Undo</button>
                `;
            } else if (type === 'deleted') {
                buttonsHtml = `
                    <button class="ml-4 px-3 py-1 bg-yellow-600 hover:bg-yellow-700 rounded-md text-white text-xs" data-id="${booking.id}" data-list-type="deleted" data-action="undo">Undo</button>
                `;
            }

            return `
                <div class="bg-white/10 p-3 rounded-lg flex justify-between items-center text-sm">
                    <span class="font-medium">${displayString}</span>
                    <div class="flex items-center"> ${buttonsHtml}
                    </div>
                </div>
            `;
        }

        function renderPendingBookings() {
            if (pendingBookings.length === 0) {
                pendingBookingsListElement.innerHTML = '<p class="text-white text-center w-full">No pending bookings.</p>';
            } else {
                pendingBookingsListElement.innerHTML = pendingBookings.map((booking, index) => renderShortenedBookingItem(booking, 'pending', index)).join('');
                // Event listeners are now handled by delegation on the parent
            }
        }

        function renderDeletedBookings() {
            if (deletedBookings.length === 0) {
                deletedBookingsListElement.innerHTML = '<p class="text-white text-center w-full">No deleted bookings.</p>';
            } else {
                deletedBookingsListElement.innerHTML = deletedBookings.map((booking, index) => renderShortenedBookingItem(booking, 'deleted', index)).join('');
                // Event listeners are now handled by delegation on the parent
            }
        }

        function updateNavigationButtons() {
            prevButton.disabled = currentBookingIndex === 0;
            nextButton.disabled = bookingsData.length === 0 || currentBookingIndex === bookingsData.length - 1;
        }

        function showNextCard() {
            if (currentBookingIndex < bookingsData.length - 1) {
                currentBookingIndex++;
                renderBookingCard();
            }
        }

        function showPrevCard() {
            if (currentBookingIndex > 0) {
                currentBookingIndex--;
                renderBookingCard();
            }
        }

        prevButton.addEventListener('click', showPrevCard);
        nextButton.addEventListener('click', showNextCard);

        function moveBookingToPending() {
            if (bookingsData.length === 0) return;

            const bookingToMove = bookingsData[currentBookingIndex];
            
            const existingStagedIndex = stagedChanges.findIndex(s => s.id === bookingToMove.id);
            if (existingStagedIndex !== -1) {
                stagedChanges[existingStagedIndex].newStatus = 'Pending';
                stagedChanges[existingStagedIndex].originalSource = 'requests';
                delete stagedChanges[existingStagedIndex].scheduledTime; // Clear scheduledTime
            } else {
                stagedChanges.push({
                    id: bookingToMove.id,
                    newStatus: 'Pending',
                    originalSource: 'requests'
                });
            }

            bookingsData.splice(currentBookingIndex, 1);
            bookingToMove.Status = 'Pending';
            pendingBookings.push(bookingToMove);
            adjustCurrentBookingIndex();
            renderBookingCard();
            renderPendingBookings();
            updateSaveButtonState();
            console.log("Staged move to pending for booking ID:", bookingToMove.id);
            console.log("Staged Changes after move to pending:", JSON.parse(JSON.stringify(stagedChanges)));
        }

        function deleteBooking() {
            if (bookingsData.length === 0) return;

            const bookingToDelete = bookingsData[currentBookingIndex];

            const existingStagedIndex = stagedChanges.findIndex(s => s.id === bookingToDelete.id);
            if (existingStagedIndex !== -1) {
                stagedChanges[existingStagedIndex].newStatus = 'Deleted';
                stagedChanges[existingStagedIndex].originalSource = 'requests';
                delete stagedChanges[existingStagedIndex].scheduledTime; // Clear scheduledTime
            } else {
                stagedChanges.push({
                    id: bookingToDelete.id,
                    newStatus: 'Deleted',
                    originalSource: 'requests'
                });
            }

            bookingsData.splice(currentBookingIndex, 1);
            bookingToDelete.Status = 'Deleted';
            bookingToDelete._originalSource = 'requests';
            deletedBookings.push(bookingToDelete);
            adjustCurrentBookingIndex();
            renderBookingCard();
            renderDeletedBookings();
            updateSaveButtonState();
            console.log("Staged delete for booking ID:", bookingToDelete.id);
            console.log("Staged Changes after delete:", JSON.parse(JSON.stringify(stagedChanges)));
        }

        function adjustCurrentBookingIndex() {
            if (bookingsData.length > 0) {
                if (currentBookingIndex >= bookingsData.length) {
                    currentBookingIndex = bookingsData.length - 1;
                }
            } else {
                currentBookingIndex = 0;
            }
        }

        moveToPendingBtn.addEventListener('click', moveBookingToPending);
        deleteBookingBtn.addEventListener('click', deleteBooking);

        // Event delegation for pending and deleted lists
        pendingBookingsListElement.addEventListener('click', handleListButtonAction);
        deletedBookingsListElement.addEventListener('click', handleListButtonAction);

        function handleListButtonAction(event) {
            const button = event.target.closest('button[data-action]'); // Use .closest to handle clicks on child elements of the button
            if (!button) return; // Not a button with data-action

            const bookingId = button.dataset.id;
            const listType = button.dataset.listType;
            const action = button.dataset.action;

            let bookingToProcess;
            let targetStatus;
            let originalSourceForStaging;

            if (listType === 'pending') {
                bookingToProcess = pendingBookings.find(b => b.id === bookingId);
                if (!bookingToProcess) return;

                if (action === 'complete') {
                    openBookingCalendarModal(bookingToProcess);
                    return; // Exit, as calendar modal handles staging for completion
                } else if (action === 'delete') {
                    targetStatus = 'Deleted';
                    originalSourceForStaging = 'pending';
                    pendingBookings = pendingBookings.filter(b => b.id !== bookingId);
                    bookingToProcess.Status = 'Deleted';
                    bookingToProcess._originalSource = 'pending';
                    deletedBookings.push(bookingToProcess);
                } else if (action === 'undo') {
                    targetStatus = 'New';
                    pendingBookings = pendingBookings.filter(b => b.id !== bookingId);
                    bookingToProcess.Status = 'New';
                    // Reset _originalSource if it's going back to 'New' requests
                    delete bookingToProcess._originalSource; 
                    bookingsData.push(bookingToProcess);
                    if (bookingsData.length > 0) {
                        currentBookingIndex = bookingsData.length - 1;
                    }
                }
                
                const existingStagedIndex = stagedChanges.findIndex(s => s.id === bookingToProcess.id);
                if (existingStagedIndex !== -1) {
                    stagedChanges[existingStagedIndex].newStatus = targetStatus;
                    // Only set originalSource if it's for 'Deleted' status, otherwise clear it.
                    if (targetStatus === 'Deleted') {
                        stagedChanges[existingStagedIndex].originalSource = originalSourceForStaging;
                    } else {
                        delete stagedChanges[existingStagedIndex].originalSource;
                    }
                    delete stagedChanges[existingStagedIndex].scheduledTime; // Clear scheduledTime
                } else {
                    stagedChanges.push({
                        id: bookingToProcess.id,
                        newStatus: targetStatus,
                        originalSource: targetStatus === 'Deleted' ? originalSourceForStaging : undefined // Only set if target is Deleted
                    });
                }

            } else if (listType === 'deleted') {
                bookingToProcess = deletedBookings.find(b => b.id === bookingId);
                if (!bookingToProcess) return;

                if (action === 'undo') {
                    targetStatus = bookingToProcess._originalSource === 'requests' ? 'New' : 'Pending';
                    originalSourceForStaging = bookingToProcess._originalSource;

                    deletedBookings = deletedBookings.filter(b => b.id !== bookingId);
                    bookingToProcess.Status = targetStatus;
                    // When undoing a delete, put it back to its _originalSource's list
                    if (originalSourceForStaging === 'requests') {
                        bookingsData.push(bookingToProcess);
                        if (bookingsData.length > 0) {
                            currentBookingIndex = bookingsData.length - 1;
                        }
                    } else if (originalSourceForStaging === 'pending') {
                        pendingBookings.push(bookingToProcess);
                    }
                }
                const existingStagedIndex = stagedChanges.findIndex(s => s.id === bookingToProcess.id);
                if (existingStagedIndex !== -1) {
                    stagedChanges[existingStagedIndex].newStatus = targetStatus;
                    // Restore originalSource for staging purposes if moving back to pending, clear if to new
                    if (targetStatus === 'Pending') {
                        stagedChanges[existingStagedIndex].originalSource = originalSourceForStaging;
                    } else {
                        delete stagedChanges[existingStagedIndex].originalSource;
                    }
                    delete stagedChanges[existingStagedIndex].scheduledTime; // Clear scheduledTime
                } else {
                    stagedChanges.push({
                        id: bookingToProcess.id,
                        newStatus: targetStatus,
                        originalSource: targetStatus === 'Pending' ? originalSourceForStaging : undefined // Only set if target is Pending
                    });
                }
            }

            // These are always called, unless `complete` action which `return`s early
            renderBookingCard();
            renderPendingBookings();
            renderDeletedBookings();
            updateSaveButtonState();
            console.log(`Staged ${action} from ${listType} for booking ID:`, bookingToProcess.id);
            console.log("Staged Changes after list action:", JSON.parse(JSON.stringify(stagedChanges)));
        }

        confirmScheduleBtn.addEventListener('click', async () => {
            if (selectedEventDate && currentBookingBeingScheduled) {
                showConfirm(`Confirm booking "${currentBookingBeingScheduled.id}" for ${selectedEventDate.toLocaleString()}?`, async () => {
                    showLoading("Completing booking...");

                    try {
                        const bookingId = currentBookingBeingScheduled.id;
                        const existingStagedIndex = stagedChanges.findIndex(s => s.id === bookingId);

                        const updateData = {
                            id: bookingId,
                            newStatus: 'Completed',
                            scheduledTime: selectedEventDate, // This is the Date object
                            fullBookingData: currentBookingBeingScheduled 
                        };

                        if (existingStagedIndex !== -1) {
                            stagedChanges[existingStagedIndex] = updateData; // Overwrite previous stage
                        } else {
                            stagedChanges.push(updateData);
                        }

                        // Update local arrays immediately for UI reflection
                        pendingBookings = pendingBookings.filter(b => b.id !== bookingId);
                        currentBookingBeingScheduled.Status = 'Completed';
                        currentBookingBeingScheduled.ScheduledDateTime = Timestamp.fromDate(selectedEventDate); // Update local object for display
                        delete currentBookingBeingScheduled._originalSource; // Clear _originalSource for completed

                        renderPendingBookings();
                        updateSaveButtonState(); // Reflect changes in save button

                        showMessage("Booking staged for completion! Click 'Save Changes' to finalize.", 'success');
                        hideLoading();
                        calendarOverlay.classList.add('hidden');
                        document.body.style.overflow = '';
                        console.log("Staged Changes after calendar completion:", JSON.parse(JSON.stringify(stagedChanges)));

                    } catch (error) {
                        console.error("Error during booking completion staging:", error);
                        showMessage("Failed to stage booking completion: " + error.message, 'error');
                        hideLoading();
                    }
                }, () => {
                    showMessage("Booking confirmation cancelled.", 'info');
                });
            } else {
                showMessage("Please select a date and time for the booking.", 'info');
            }
        });

        saveChangesBtn.addEventListener('click', async () => {
            console.log("Save Changes button clicked!"); // Debug log
            if (stagedChanges.length === 0) {
                showMessage("No changes to save.", 'info');
                return;
            }

            showConfirm(`Are you sure you want to save ${stagedChanges.length} changes to the database?`, async () => {
                showLoading("Saving changes to Database...");

                try {
                    const result = await sendBatchBookingUpdates(stagedChanges);

                    if (result.success) {
                        showMessage("Changes saved successfully!", 'success');
                        stagedChanges = []; // Clear staged changes only upon successful commit
                        updateSaveButtonState(); // Update button state to reflect cleared changes
                    } else {
                        showMessage("Failed to save changes: " + result.error, 'error');
                    }
                } finally {
                    hideLoading();
                }
            }, () => {
                showMessage("Save cancelled.", 'info');
            });
        });

    </script>
</body>
