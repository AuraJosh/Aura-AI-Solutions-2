    /* Custom CSS from analytics page (kept for visual consistency, though chat logs not present here) */
    .chat-logs-container {
        display: flex;
        flex-direction: column-reverse; /* Stacks items from bottom to top */
        overflow-y: auto;           /* Enables vertical scrolling */
        height: 240px;              /* Set a fixed height (h-60 in Tailwind is 15rem = 240px) */
        justify-content: flex-start;    /* Aligns content to the start (bottom, due to reverse) */
    }
    .chat-log-message {
        padding-bottom: 8px;
    }
    /* Optional: Add backdrop-filter for a subtle blur effect behind the overlay */
    #loading-overlay {
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px); /* For Safari compatibility */
    }

    /* Monochrome Geometric Flip Loader CSS */
    .geometric-loader {
        width: 60px; /* w-16 is 64px, adjusting to 60px for exact match */
        aspect-ratio: .5;
        display: grid;
        justify-items: center;  
        align-items: center;
    }
    .geometric-loader::before {
        content: "";
        width: 30%;
        aspect-ratio: 1;
        border-radius: 50%;
        margin: auto auto 0;
        background: #9CA3AF; /* Tailwind gray-400 - light gray/blue-gray */
        animation: l9-0 .5s cubic-bezier(0,800,1,800) infinite;
    }
    .geometric-loader::after {
        content: "";
        width: 100%;
        aspect-ratio: 1 / 0.866;
        margin: 0 auto auto;
        clip-path: polygon(50% -50%,100% 50%,50% 150%,0 50%);
        background: #3B82F6; /* Tailwind blue-500 - matches your UI accents */
        animation: l9-1 .5s linear infinite;
    }
    @keyframes l9-0 {
        0%,2%  {translate: 0   0%}
        98%,to {translate: 0 -.2%}
    }
    @keyframes l9-1 {
        0%,5%  {rotate:  0deg}
        95%,to {rotate:-60deg}
    }
    /* Basic styling for custom message box */
    .message-box {
        position: fixed;
        top: 1rem;
        right: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        color: white;
        z-index: 1000;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .message-box.info { background-color: #3B82F6; /* blue-500 */ }
    .message-box.error { background-color: #EF4444; /* red-500 */ }
    .message-box.success { background-color: #22C55E; /* green-500 */ }

    /* Custom calendar styles from user prompt */
    #calendar-grid {
        scrollbar-width: thin;
        scrollbar-color: #4b5563 #1f2937;
    }
    #calendar-grid::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    #calendar-grid::-webkit-scrollbar-track {
        background: #1f2937;
    }
    #calendar-grid::-webkit-scrollbar-thumb {
        background-color: #4b5563;
        border-radius: 4px;
    }

    /* Styles for selected time slots */
    .time-slot.selected {
        background-color: #1D4ED8; /* blue-700 */
        border: 2px solid #3B82F6; /* blue-500 */
    }
    .day-cell-month-selected {
        background-color: #1D4ED8; /* blue-700 */
        border: 2px solid #3B82F6 !important; /* blue-500 */
    }

    /* Event display styles */
    .calendar-event {
        background-color: #EF4444; /* red-500 for booked events */
        color: white;
        padding: 2px 4px;
        border-radius: 4px;
        font-size: 0.7rem;
        line-height: 1rem;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        cursor: pointer;
    }
    .calendar-event.pending {
        background-color: #F59E0B; /* amber-500 for pending events (if you decide to display them) */
    }
    </style>
</head>

        function showLoading(message) {

            loadingOverlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function hideLoading() {
            loadingOverlay.classList.add('hidden');

        function updateSaveButtonState() {
            saveChangesBtn.disabled = (stagedChanges.length + stagedScheduledMeetings.length) === 0;
            if ((stagedChanges.length + stagedScheduledMeetings.length) > 0) {
                saveChangesBtn.textContent = `Save Changes (${stagedChanges.length + stagedScheduledMeetings.length})`;
            } else {
                saveChangesBtn.textContent = 'Save Changes to Database';
            }

        function showMessage(message, type = 'info') {
            const messageBox = document.createElement('div');
            messageBox.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg text-white z-[101]`;
            if (type === 'error') {
                messageBox.classList.add('bg-red-600');
            } else if (type === 'success') {
                messageBox.classList.add('bg-green-600');
            } else {
                messageBox.classList.add('bg-blue-600');
            }
            messageBox.textContent = message;
            document.body.appendChild(messageBox);
            setTimeout(() => {
                messageBox.remove();
            }, 3000);
        }

        function showConfirm(message, onConfirm, onCancel) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-[102]';
            modal.innerHTML = `
                <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-sm text-center">
                    <p class="text-white text-lg mb-6">${message}</p>
                    <div class="flex justify-center space-x-4">

                        <button id="confirm-no" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg font-semibold transition duration-200">No</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('confirm-yes').onclick = () => {
                modal.remove();
                onConfirm();
            };
            document.getElementById('confirm-no').onclick = () => {
                modal.remove();
                onCancel();
            };
        }

        // --- CUSTOM CALENDAR LOGIC ---

        async function fetchCalendarEvents(startDate, endDate) {
            if (!currentAccountId) {
                console.warn("Account ID not available for fetching calendar events.");
                return [];
            }
            try {
                const events = [];
                // Now querying the NEW scheduled_meetings collection
                const scheduledMeetingsRef = collection(db, 'accounts', currentAccountId, 'scheduled_meetings');
                
                // Query for scheduled meetings within the date range
                // Assumes 'ScheduledDateTime' is the field for the meeting's start time in this new collection
                const qScheduled = query(scheduledMeetingsRef,
                    where('ScheduledDateTime', '>=', Timestamp.fromDate(startDate)),
                    where('ScheduledDateTime', '<=', Timestamp.fromDate(endDate))
                );
                console.log("Querying for Scheduled Meetings from 'scheduled_meetings' collection...");
                const querySnapshotScheduled = await getDocs(qScheduled);
                console.log("Scheduled Meetings query snapshot size:", querySnapshotScheduled.size);
                querySnapshotScheduled.docs.forEach(doc => {
                    const data = doc.data();
                    console.log("Fetched Scheduled Meeting data:", data);
                    if (data.ScheduledDateTime && data.ScheduledDateTime.toDate) {
                        events.push({
                            title: data.Customer_Name || data.Email || 'Meeting',
                            start: data.ScheduledDateTime.toDate(),
                            end: new Date(data.ScheduledDateTime.toDate().getTime() + (data.DurationHours || 1) * 60 * 60 * 1000), // Use DurationHours if available, default to 1hr
                            type: 'scheduled', // A new type for confirmed meetings
                            originalBookingId: data.originalBookingId || null // Link back to original booking if needed
                        });
                    } else {
                        console.warn("Scheduled meeting missing ScheduledDateTime or invalid:", data);
                    }
                });

                // Optionally, if you still want to display pending bookings with *fixed* times on the calendar
                // that are still in the 'bookings' collection, you can keep this part.
                // Otherwise, remove it for a cleaner separation.
                // I'll keep it for now as it was in the previous version, but note the separation.
                const bookingsRef = collection(db, 'accounts', currentAccountId, 'bookings');
                const qPending = query(bookingsRef,
                    where('Status', '==', 'Pending'), // Or whatever status means it has a scheduled time but isn't confirmed
                    where('ScheduledDateTime', '>=', Timestamp.fromDate(startDate)),
                    where('ScheduledDateTime', '<=', Timestamp.fromDate(endDate))
                );
                console.log("Querying for Pending bookings from 'bookings' collection...");
                const querySnapshotPending = await getDocs(qPending);
                console.log("Pending query snapshot size:", querySnapshotPending.size);
                querySnapshotPending.docs.forEach(doc => {
                    const data = doc.data();
                    console.log("Fetched Pending booking data:", data);
                    if (data.ScheduledDateTime && data.ScheduledDateTime.toDate) {
                        events.push({
                            title: data.Customer_Name || data.Email || 'Pending Booking',
                            start: data.ScheduledDateTime.toDate(),
                            end: new Date(data.ScheduledDateTime.toDate().getTime() + 60 * 60 * 1000), // Assume 1 hour default
                            type: 'pending'
                        });
                    } else {
                        console.warn("Pending booking missing ScheduledDateTime or invalid:", data);
                    }
                });
                
                console.log("Total events fetched for calendar:", events);
                return events;
            } catch (error) {
                console.error("Error fetching calendar events:", error);
                showMessage("Error loading calendar events.", 'error');
                return [];
            }
        }


        function openBookingCalendarModal(bookingData) {
            currentBookingBeingScheduled = bookingData;
            selectedEventDate = null; // Reset selection
            confirmScheduleBtn.disabled = true; // Disable until a time is selected
            
            // Clear any previously selected elements in the calendar UI
            document.querySelectorAll('.time-slot.selected').forEach(el => el.classList.remove('selected'));
            document.querySelectorAll('.day-cell-month-selected').forEach(el => el.classList.remove('day-cell-month-selected'));

            calendarOverlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Prevent scrolling background
            renderCalendar(); // Render the calendar when opening
        }
        
        async function renderCalendar() {
            calendarGrid.innerHTML = ''; // Clear previous content
            confirmScheduleBtn.disabled = true; // Disable confirm button on re-render

            let fetchStartDate, fetchEndDate;

            // Determine fetch range based on current view
            if (currentView === 'month') {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                fetchStartDate = new Date(year, month, 1);
                fetchEndDate = new Date(year, month + 1, 0, 23, 59, 59); // End of month
                calendarTitle.textContent = `${new Intl.DateTimeFormat('en-US', { month: 'long' }).format(currentDate)} ${year}`;
            } else if (currentView === 'week') {
                const startOfWeek = new Date(currentDate);
                startOfWeek.setDate(currentDate.getDate() - currentDate.getDay()); // Sunday
                startOfWeek.setHours(0, 0, 0, 0);
                
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6); // Saturday
                endOfWeek.setHours(23, 59, 59, 999);

                fetchStartDate = startOfWeek;
                fetchEndDate = endOfWeek;

                calendarTitle.textContent = `
                    ${startOfWeek.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - 
                    ${endOfWeek.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}
                `;
            } else { // Day View
                const startOfDay = new Date(currentDate);
                startOfDay.setHours(0, 0, 0, 0);
                const endOfDay = new Date(currentDate);
                endOfDay.setHours(23, 59, 59, 999);

                fetchStartDate = startOfDay;
                fetchEndDate = endOfDay;

                calendarTitle.textContent = currentDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            }

            // Fetch events before rendering

            calendarGrid.appendChild(headerRow);

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            let dayCounter = 1;
            let nextMonthDayCounter = 1;
            let currentDayMs = new Date().setHours(0,0,0,0);

            for (let i = 0; i < 6; i++) {
                const weekRow = document.createElement('div');
                weekRow.className = 'grid grid-cols-7 gap-1';

                for (let j = 0; j < 7; j++) {
                    const dayCell = document.createElement('div');
                    dayCell.className = 'h-24 border border-gray-700 rounded p-1 overflow-hidden flex flex-col relative group';
                    const dateNumDiv = document.createElement('div');
                    dateNumDiv.className = 'text-right font-medium mb-1';
                    
                    let cellDate;

                    if (i === 0 && j < firstDayOfMonth) {
                        const prevMonthDay = daysInPrevMonth - (firstDayOfMonth - j - 1);
                        dateNumDiv.textContent = prevMonthDay;
                        dayCell.classList.add('bg-gray-900/50', 'text-gray-600');
                        cellDate = new Date(year, month - 1, prevMonthDay);
                    } else if (dayCounter > daysInMonth) {
                        dateNumDiv.textContent = nextMonthDayCounter;
                        dayCell.classList.add('bg-gray-900/50', 'text-gray-600');
                        cellDate = new Date(year, month + 1, nextMonthDayCounter);
                        nextMonthDayCounter++;
                    } else {
                        dateNumDiv.textContent = dayCounter;
                        cellDate = new Date(year, month, dayCounter);

                        if (cellDate.setHours(0,0,0,0) === currentDayMs) {
                            dayCell.classList.add('border-blue-500', 'border-2');
                        }
                        
                        dayCell.dataset.date = cellDate.toISOString();
                        dayCell.classList.add('cursor-pointer', 'hover:bg-gray-700/50');

                            document.querySelectorAll('.time-slot.selected').forEach(el => el.classList.remove('selected'));

                            e.currentTarget.classList.add('day-cell-month-selected');
                            showMessage(`Selected: ${selectedEventDate.toLocaleDateString()} (click time slot for specific hour in week/day view)`, 'info');
                        });

                        dayCounter++;
                    }
                    
                    dayCell.appendChild(dateNumDiv);
                    
                    const eventsContainer = document.createElement('div');
                    eventsContainer.className = 'text-xs space-y-1 overflow-y-auto h-16';
                    
                    // Add events for this cell's date
                    fetchedCalendarEvents.forEach(event => {
                        // Check if event falls on this date (ignoring time for month view initial rendering)

        async function initializeBookingData() {
            showLoading("Finding your account...");

            try {
                const userMappingDocRef = doc(db, 'user_mappings', currentUserUid);
                const userMappingSnap = await getDoc(userMappingDocRef);

                if (!userMappingSnap.exists()) {
                    const errorMessage = `No account mapping found for your user ID: ${currentUserUid}. Please contact support.`;
                    bookingCardElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    pendingBookingsListElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    deletedBookingsListElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    hideLoading();
                    return;
                }

                currentAccountId = userMappingSnap.data().accountId;
                console.log("Mapped Account ID:", currentAccountId);

                if (!currentAccountId) {
                    const errorMessage = `Account ID not found in mapping for user ID: ${currentUserUid}. Please contact support.`;
                    bookingCardElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    pendingBookingsListElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    deletedBookingsListElement.innerHTML = `<p class="text-red-400 text-center w-full">${errorMessage}</p>`;
                    hideLoading();
                    return;
                }

                showLoading("Loading your booking data...");

                const bookingsCollectionRef = collection(db, 'accounts', currentAccountId, 'bookings');
                onSnapshot(bookingsCollectionRef, (snapshot) => {
                    bookingsData = [];
                    pendingBookings = [];
                    deletedBookings = [];
                    bookingFieldsConfig = []; 

                    snapshot.forEach(doc => {
                        const booking = { id: doc.id, ...doc.data() };
                        const status = booking.Status ? booking.Status.toString().trim() : '';

                        if (bookingFieldsConfig.length === 0) {
                             Object.keys(booking).forEach(key => {
                                if (key !== 'id' && key !== 'Status' && key !== '_originalSource' && key !== 'Timestamp' && key !== 'ScheduledDateTime') {
                                    bookingFieldsConfig.push({ field: key, question: key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) });
                                }
                            });
                            if (!bookingFieldsConfig.some(f => f.field === 'Timestamp')) {
                                bookingFieldsConfig.push({ field: 'Timestamp', question: 'Timestamp' });
                            }
                            if (!bookingFieldsConfig.some(f => f.field === 'ScheduledDateTime')) {
                                bookingFieldsConfig.push({ field: 'ScheduledDateTime', question: 'Scheduled Date/Time' });
                            }
                            if (!bookingFieldsConfig.some(f => f.field === 'Status')) {
                                bookingFieldsConfig.push({ field: 'Status', question: 'Status' });
                            }
                        }

                        // Filter out 'Scheduled' bookings from these lists as they now go to scheduled_meetings
                        if (status === 'New' || status === '') {
                            bookingsData.push(booking);
                        } else if (status === 'Pending') {
                            pendingBookings.push(booking);
                        } else if (status === 'Deleted') {
                            booking._originalSource = booking._originalSource || 'UNKNOWN';
                            deletedBookings.push(booking);
                        }
                    });

                    bookingsData.sort((a, b) => {
                        const dateA = a.Timestamp && a.Timestamp.toDate ? a.Timestamp.toDate() : (a.Timestamp instanceof Date ? a.Timestamp : new Date(0));
                        const dateB = b.Timestamp && b.Timestamp.toDate ? b.Timestamp.toDate() : (b.Timestamp instanceof Date ? b.Timestamp : new Date(0));
                        return dateA - dateB;
                    });
                    pendingBookings.sort((a, b) => {
                        const dateA = a.Timestamp && a.Timestamp.toDate ? a.Timestamp.toDate() : (a.Timestamp instanceof Date ? a.Timestamp : new Date(0));
                        const dateB = b.Timestamp && b.Timestamp.toDate ? b.Timestamp.toDate() : (b.Timestamp instanceof Date ? b.Timestamp : new Date(0));
                        return dateA - dateB;
                    });
                    deletedBookings.sort((a, b) => {
                        const dateA = a.Timestamp && a.Timestamp.toDate ? a.Timestamp.toDate() : (a.Timestamp instanceof Date ? a.Timestamp : new Date(0));
                        const dateB = b.Timestamp && b.Timestamp.toDate ? b.Timestamp.toDate() : (b.Timestamp instanceof Date ? b.Timestamp : new Date(0));
                        return dateA - dateB;
                    });

                    if (bookingsData.length > 0) {
                        currentBookingIndex = Math.min(currentBookingIndex, bookingsData.length - 1);
                    } else {
                        currentBookingIndex = 0;
                    }

                    renderBookingCard();
                    renderPendingBookings();
                    renderDeletedBookings();
                    updateSaveButtonState();
                    hideLoading();
                    console.log("Booking data updated from Firestore.");
                }, (error) => {
                    console.error("Error listening to bookings:", error);
                    const errorMessage = `<p class="text-red-400 text-center w-full">Failed to load booking data: ${error.message}. Please check security rules or contact support.</p>`;
                    bookingCardElement.innerHTML = errorMessage;
                    pendingBookingsListElement.innerHTML = errorMessage;
                    deletedBookingsListElement.innerHTML = errorMessage;
                    hideLoading();
                });

            } catch (error) {
                console.error('Error during initial setup or data fetch:', error);
                const fetchErrorMessage = `<p class="text-red-400 text-center w-full">Failed to initialize booking data: ${error.message}.</p>`;
                bookingCardElement.innerHTML = fetchErrorMessage;
                pendingBookingsListElement.innerHTML = fetchErrorMessage;
                deletedBookingsListElement.innerHTML = fetchErrorMessage;
                hideLoading();
            }
        }

        // Modified function to send batch updates
        async function sendBatchBookingUpdates(updates) {
            if (!currentAccountId) {
                console.error("Account not identified, cannot send update.");
                return { success: false, error: "Account not identified." };
            }

            if (updates.length === 0 && stagedScheduledMeetings.length === 0) { // Check both staged arrays
                return { success: true, message: "No changes to save." };
            }

            const batch = writeBatch(db);

            // 1. Handle updates for the 'bookings' collection (status changes for original requests)
            updates.forEach(change => {
                const bookingDocRef = doc(db, 'accounts', currentAccountId, 'bookings', change.id);
                const updateData = { Status: change.newStatus };

                if (change.newStatus === 'Deleted') {
                    updateData._originalSource = change.originalSource || 'UNKNOWN';
                } else if (change.newStatus === 'Scheduled') { // New status: 'Scheduled' for original booking
                    updateData._originalSource = FieldValue.delete(); // Clear originalSource
                    // ScheduledDateTime will be stored in the new collection, not here.
                }
                else { // 'New' or 'Pending' or 'Undo' from Deleted to New/Pending
                    updateData._originalSource = FieldValue.delete();
                }
                batch.update(bookingDocRef, updateData);
            });

            // 2. Handle creations for the 'scheduled_meetings' collection
            for (const meeting of stagedScheduledMeetings) {
                const newMeetingRef = doc(collection(db, 'accounts', currentAccountId, 'scheduled_meetings')); // Auto-ID
                batch.set(newMeetingRef, {
                    // Copy relevant fields from the original booking
                    originalBookingId: meeting.originalBookingId,
                    Customer_Name: meeting.Customer_Name,
                    Email: meeting.Email,
                    Subject: meeting.Subject,
                    Service: meeting.Service,
                    ScheduledDateTime: Timestamp.fromDate(meeting.scheduledTime),
                    DurationHours: meeting.durationHours || 1, // Default to 1 hour
                    CreatedAt: Timestamp.now()
                    // Add any other fields you want to copy to the scheduled meeting
                });
            }

            try {
                await batch.commit();
                // Clear both staged arrays on successful commit
                stagedScheduledMeetings = []; 
                stagedChanges = []; // Also clear general stagedChanges

                return { success: true, message: "Booking statuses and scheduled meetings updated successfully." };
            } catch (error) {
                console.error('Error committing batch updates:', error);
                return { success: false, error: `Failed to save changes: ${error.message}` };
            }
        }

                pendingBookingsListElement.innerHTML = '<p class="text-white text-center w-full">No pending bookings.</p>';
            } else {
                pendingBookingsListElement.innerHTML = pendingBookings.map((booking, index) => renderShortenedBookingItem(booking, 'pending', index)).join('');
                pendingBookingsListElement.querySelectorAll('button[data-action]').forEach(button => {
                    button.addEventListener('click', handleListButtonAction);
                });
            }
        }

        function renderDeletedBookings() {
            if (deletedBookings.length === 0) {
                deletedBookingsListElement.innerHTML = '<p class="text-white text-center w-full">No deleted bookings.</p>';
            } else {
                deletedBookingsListElement.innerHTML = deletedBookings.map((booking, index) => renderShortenedBookingItem(booking, 'deleted', index)).join('');
                deletedBookingsListElement.querySelectorAll('button[data-action]').forEach(button => {
                    button.addEventListener('click', handleListButtonAction);
                });
            }
        }

        function updateNavigationButtons() {
            prevButton.disabled = currentBookingIndex === 0;
            nextButton.disabled = bookingsData.length === 0 || currentBookingIndex === bookingsData.length - 1;
        }

        function showNextCard() {
            if (currentBookingIndex < bookingsData.length - 1) {
                currentBookingIndex++;
                renderBookingCard();
            }
        }

        function showPrevCard() {
            if (currentBookingIndex > 0) {
                currentBookingIndex--;
                renderBookingCard();
            }
        }

        prevButton.addEventListener('click', showPrevCard);
        nextButton.addEventListener('click', showNextCard);

        function moveBookingToPending() {
            if (bookingsData.length === 0) return;

            const bookingToMove = bookingsData[currentBookingIndex];
            
            const existingStagedIndex = stagedChanges.findIndex(s => s.id === bookingToMove.id);
            if (existingStagedIndex !== -1) {
                stagedChanges[existingStagedIndex].newStatus = 'Pending';
                stagedChanges[existingStagedIndex].originalSource = 'requests';
            } else {
                stagedChanges.push({
                    id: bookingToMove.id,
                    newStatus: 'Pending',
                    originalSource: 'requests'
                });
            }

            bookingsData.splice(currentBookingIndex, 1);
            bookingToMove.Status = 'Pending';
            pendingBookings.push(bookingToMove);
            adjustCurrentBookingIndex();
            renderBookingCard();
            renderPendingBookings();
            updateSaveButtonState();
            console.log("Staged move to pending for booking ID:", bookingToMove.id);
        }

        function deleteBooking() {
            if (bookingsData.length === 0) return;

            const bookingToDelete = bookingsData[currentBookingIndex];

            const existingStagedIndex = stagedChanges.findIndex(s => s.id === bookingToDelete.id);
            if (existingStagedIndex !== -1) {
                stagedChanges[existingStagedIndex].newStatus = 'Deleted';
                stagedChanges[existingStagedIndex].originalSource = 'requests';
            } else {
                stagedChanges.push({
                    id: bookingToDelete.id,
                    newStatus: 'Deleted',
                    originalSource: 'requests'
                });
            }

            bookingsData.splice(currentBookingIndex, 1);
            bookingToDelete.Status = 'Deleted';
            bookingToDelete._originalSource = 'requests';
            deletedBookings.push(bookingToDelete);
            adjustCurrentBookingIndex();
            renderBookingCard();
            renderDeletedBookings();
            updateSaveButtonState();
            console.log("Staged delete for booking ID:", bookingToDelete.id);
        }

        function adjustCurrentBookingIndex() {
            if (bookingsData.length > 0) {
                if (currentBookingIndex >= bookingsData.length) {
                    currentBookingIndex = bookingsData.length - 1;
                }
            } else {
                currentBookingIndex = 0;
            }
        }

        moveToPendingBtn.addEventListener('click', moveBookingToPending);
        deleteBookingBtn.addEventListener('click', deleteBooking);

        function handleListButtonAction(event) {
            const button = event.target;
            const bookingId = button.dataset.id;
            const listType = button.dataset.listType;
            const action = button.dataset.action;

            let bookingToProcess;
            let targetStatus;
            let originalSourceForStaging;

            if (listType === 'pending') {
                bookingToProcess = pendingBookings.find(b => b.id === bookingId);
                if (!bookingToProcess) return;

                if (action === 'complete') {
                    openBookingCalendarModal(bookingToProcess);
                    return;
                } else if (action === 'delete') {
                    targetStatus = 'Deleted';
                    originalSourceForStaging = 'pending';
                    pendingBookings = pendingBookings.filter(b => b.id !== bookingId);
                    bookingToProcess.Status = 'Deleted';
                    bookingToProcess._originalSource = 'pending';
                    deletedBookings.push(bookingToProcess);
                } else if (action === 'undo') {
                    targetStatus = 'New';
                    pendingBookings = pendingBookings.filter(b => b.id !== bookingId);
                    bookingToProcess.Status = 'New';
                    bookingsData.push(bookingToProcess);
                    if (bookingsData.length > 0) {
                        currentBookingIndex = bookingsData.length - 1;
                    }
                }
                
                const existingStagedIndex = stagedChanges.findIndex(s => s.id === bookingToProcess.id);
                if (existingStagedIndex !== -1) {
                    stagedChanges[existingStagedIndex].newStatus = targetStatus;
                    stagedChanges[existingStagedIndex].originalSource = originalSourceForStaging || bookingToProcess._originalSource;
                } else {
                    stagedChanges.push({
                        id: bookingToProcess.id,
                        newStatus: targetStatus,
                        originalSource: originalSourceForStaging || bookingToProcess._originalSource
                    });
                }

            } else if (listType === 'deleted') {
                bookingToProcess = deletedBookings.find(b => b.id === bookingId);
                if (!bookingToProcess) return;

                if (action === 'undo') {
                    targetStatus = bookingToProcess._originalSource === 'requests' ? 'New' : 'Pending';
                    originalSourceForStaging = bookingToProcess._originalSource;

                    deletedBookings = deletedBookings.filter(b => b.id !== bookingId);
                    bookingToProcess.Status = targetStatus;
                    if (originalSourceForStaging === 'requests') {
                        bookingsData.push(bookingToProcess);
                        if (bookingsData.length > 0) {
                            currentBookingIndex = bookingsData.length - 1;
                        }
                    } else if (originalSourceForStaging === 'pending') {
                        pendingBookings.push(bookingToProcess);
                    }
                }
                const existingStagedIndex = stagedChanges.findIndex(s => s.id === bookingToProcess.id);
                if (existingStagedIndex !== -1) {
                    stagedChanges[existingStagedIndex].newStatus = targetStatus;
                    stagedChanges[existingStagedIndex].originalSource = originalSourceForStaging || bookingToProcess._originalSource;
                } else {
                    stagedChanges.push({
                        id: bookingToProcess.id,
                        newStatus: targetStatus,
                        originalSource: originalSourceForStaging || bookingToProcess._originalSource
                    });
                }
            }

            if (action !== 'complete') {
                renderBookingCard();
                renderPendingBookings();
                renderDeletedBookings();
                updateSaveButtonState();
                console.log(`Staged ${action} from ${listType} for booking ID:`, bookingToProcess.id);
            }
        }

        // Handle confirmation from calendar modal
        confirmScheduleBtn.addEventListener('click', async () => {
            if (selectedEventDate && currentBookingBeingScheduled) {
                showConfirm(`Confirm booking "${currentBookingBeingScheduled.id}" for ${selectedEventDate.toLocaleString()}?`, async () => {
                    showLoading("Completing booking...");

                    try {
                        const originalBookingId = currentBookingBeingScheduled.id;

                        // 1. Stage update for the original booking to 'Scheduled' status
                        const existingStagedChangeIndex = stagedChanges.findIndex(s => s.id === originalBookingId);
                        if (existingStagedChangeIndex !== -1) {
                            stagedChanges[existingStagedChangeIndex].newStatus = 'Scheduled';
                        } else {
                            stagedChanges.push({
                                id: originalBookingId,
                                newStatus: 'Scheduled',
                                // No originalSource needed here, as it's a final state for the original request
                            });
                        }

                        // 2. Stage creation of a new document in 'scheduled_meetings'
                        stagedScheduledMeetings.push({
                            originalBookingId: originalBookingId,
                            Customer_Name: currentBookingBeingScheduled.Customer_Name || currentBookingBeingScheduled.Name || 'N/A', // Prioritize Customer_Name, fallback to Name
                            Email: currentBookingBeingScheduled.Email || 'N/A',
                            Subject: currentBookingBeingScheduled.Subject || 'Client Meeting',
                            Service: currentBookingBeingScheduled.Service || 'General Consultation',
                            scheduledTime: selectedEventDate, // The selected Date object
                            // Add other fields you want to transfer to the scheduled meeting
                            // e.g., currentBookingBeingScheduled.SomeOtherField
                        });

                        // Visually update the UI immediately
                        pendingBookings = pendingBookings.filter(b => b.id !== originalBookingId);
                        renderPendingBookings();
                        updateSaveButtonState();

                        showMessage("Booking staged for scheduling! Click 'Save Changes' to finalize.", 'success');
                        hideLoading();
                        calendarOverlay.classList.add('hidden'); // Close calendar modal
                        document.body.style.overflow = '';

                        // Clear selected date as it's been staged
                        selectedEventDate = null; 

                    } catch (error) {
                        console.error("Error during booking scheduling staging:", error);
                        showMessage("Failed to stage booking for scheduling: " + error.message, 'error');
                        hideLoading();
                    }
                }, () => {
                    showMessage("Booking confirmation cancelled.", 'info');
                });
            } else {
                showMessage("Please select a date and time for the booking.", 'info');
            }
        });

        saveChangesBtn.addEventListener('click', async () => {
            if (stagedChanges.length === 0 && stagedScheduledMeetings.length === 0) {
                showMessage("No changes to save.", 'info');
                return;
            }

            showConfirm(`Are you sure you want to save ${stagedChanges.length + stagedScheduledMeetings.length} changes to the database?`, async () => {
                showLoading("Saving changes to Database...");

                try {
                    const result = await sendBatchBookingUpdates(stagedChanges);

                    if (result.success) {
                        showMessage("Changes saved successfully!", 'success');
                        // stagedChanges and stagedScheduledMeetings are cleared inside sendBatchBookingUpdates now
                        updateSaveButtonState();
                        // Re-fetch calendar events to update display after save
                        renderCalendar(); 
                    } else {
                        showMessage("Failed to save changes: " + result.error, 'error');
                    }
                } finally {
                    hideLoading();
                }
            }, () => {
                showMessage("Save cancelled.", 'info');
            });
        });

    </script>
</body>
</html>
