<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>

    function gtag(){dataLayer.push(arguments);}

<body class="bg-gray-900 text-white min-h-screen overflow-auto">

  <!-- Header -->
  <header class="fixed top-0 w-full bg-[#060d1f] shadow z-20">
    <div class="container mx-auto flex items-center justify-between p-4">
      <div class="flex items-center space-x-4">
        <div class="relative h-20 w-[150px]">
          <img src="media/logo-dark.png" alt="Aura AI Logo" class="absolute inset-0 h-full w-full object-contain" />
        </div>
        <span class="text-white text-base">Aura AI Solutions</span>
      </div>
      <h1 class="text-white font-semibold text-lg">Analytics Dashboard</h1>
      <button id="logout-btn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-white text-sm">Logout</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="pt-40 px-4 flex justify-center relative z-10">
    <div id="data-table-container" class="w-full max-w-[1600px] h-[80vh] bg-white/10 backdrop-blur-md p-10 rounded-xl shadow-lg overflow-y-auto">
      <p class="text-white text-center">Loading your analytics data...</p> 
    </div>
  </main>

  <!-- Background Video -->
  <div class="fixed inset-0 -z-10 pointer-events-none">
    <video autoplay loop muted class="w-full h-full object-cover pointer-events-none">
      <source src="media/background.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <!-- Static fallback image for mobile -->
    <img src="media/fallback.jpg" alt="Background" class="absolute inset-0 w-full h-full object-cover block sm:hidden" />
    
    <div class="absolute inset-0 bg-black/60"></div>
  </div>

  <!-- Firebase Auth -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAwfckZ8iU2XuHqOV-Yp4RG4D9Jwjsw-P8",
      authDomain: "aura-ai-85b65.firebaseapp.com",
      projectId: "aura-ai-85b65",
      storageBucket: "aura-ai-85b65.appspot.com",
      messagingSenderId: "492492484793",
      appId: "1:492492484793:web:7f9038d50f523241536b68"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Protect this page
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      }
    });

    // Logout button
    document.getElementById("logout-btn").addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.href = "login.html";
      } catch (err) {
        alert("Logout failed: " + err.message);
      }
    });
  </script>
  <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";

        // IMPORTANT: REPLACE THIS WITH THE "Web app URL" YOU COPIED IN STEP 3!
        // Example: const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz123ABCDEF456XYZ/exec';
        const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQ_19E4zCMGH1ELYhLj3xVsHt9LUX3FiNIsUk-z--uiSWsgM8XvOTakvIg2V1eiHF5/exec'; // <--- **PASTE YOUR URL HERE**

        const auth = getAuth(); // Get the Firebase Auth instance

        // --- Data Loading Logic ---
        // This function listens for Firebase authentication state changes
        // and loads data when a user is signed in.
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // User is signed in. We can now get their unique ID.
                const userIdentifier = user.uid; // This is the unique Firebase User ID (e.g., k9tY2XzPqL8oN3rJ1sV7uA)
                console.log("Logged-in user ID (Firebase UID):", userIdentifier);

                // Call the function to fetch data using this identifier
                await loadCustomerData(userIdentifier);

            } else {
                // User is signed out. Redirect to login.
                // (Your existing onAuthStateChanged already handles this redirect to login.html)
                console.log("User is signed out. Redirecting to login.");
            }
        });

        // Function to fetch data from the Google Apps Script
        async function loadCustomerData(userIdentifier) {
            const dataTableContainer = document.getElementById('data-table-container');
            if (!dataTableContainer) {
                console.error("Error: Element with ID 'data-table-container' not found.");
                return;
            }

            // Show a loading message while data is being fetched
            dataTableContainer.innerHTML = '<p class="text-white text-center">Loading your analytics data...</p>';

            try {
                // Construct the URL to your Apps Script, including the Firebase User ID
                const response = await fetch(`${GOOGLE_APPS_SCRIPT_URL}?userId=${encodeURIComponent(userIdentifier)}`);
                
                // Check if the network request was successful
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json(); // Parse the JSON response from the Apps Script

                // Handle errors returned from the Apps Script itself
                if (data.error) {
                    dataTableContainer.innerHTML = `<p style="color: red; text-align: center;">Error: ${data.error}</p>`;
                    return;
                }
                
                // If no data is returned (e.g., user is not mapped, or no analytics for their ID)
                if (data.length === 0) {
                     dataTableContainer.innerHTML = '<p class="text-white text-center">No analytics data found for your account.</p>';
                     return;
                }

                // --- Render the data into an HTML table ---
                const headers = Object.keys(data[0]); // Get headers from the first data object
                let tableHTML = '<table class="min-w-full bg-white/5 rounded-lg overflow-hidden shadow-lg">';
                tableHTML += '<thead><tr>';
                headers.forEach(header => { 
                    // Basic styling for headers
                    tableHTML += `<th class="px-4 py-2 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">${header}</th>`; 
                });
                tableHTML += '</tr></thead><tbody>';

                data.forEach(row => {
                    tableHTML += '<tr>';
                    headers.forEach(header => { 
                        // Basic styling for data cells
                        tableHTML += `<td class="px-4 py-2 whitespace-nowrap text-sm text-gray-200 border-t border-gray-700">${row[header]}</td>`; 
                    });
                    tableHTML += '</tr>';
                });
                tableHTML += '</tbody></table>';
                
                dataTableContainer.innerHTML = tableHTML; // Display the generated table

            } catch (error) {
                console.error('Error fetching or parsing data:', error);
                dataTableContainer.innerHTML = '<p style="color: red; text-align: center;">Failed to load data. Please try again later.</p>';
            }
        }
    </script>
</body>
</html>
