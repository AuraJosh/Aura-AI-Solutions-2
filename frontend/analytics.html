<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Analytics Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-03MPB9XG9B"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        
        gtag('config', 'G-03MPB9XG9B');

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" href="media/favicon.png" type="image/png">
    <style>
    /* Custom CSS to make chat logs start from the bottom and maintain fixed height */
    .chat-logs-container {
        display: flex;
        flex-direction: column-reverse; /* Stacks items from bottom to top */
        overflow-y: auto;               /* Enables vertical scrolling */
        height: 240px;                  /* Set a fixed height (h-60 in Tailwind is 15rem = 240px) */
        justify-content: flex-start;    /* Aligns content to the start (bottom, due to reverse) */
        /* Remove max-height: 100%; as it's not needed with a fixed height */
    }
    .chat-log-message {
        /* Optional: Add some padding to separate messages visually */
        padding-bottom: 8px; 
    }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen overflow-auto">

    <header class="fixed top-0 w-full bg-[#060d1f] shadow z-20">
        <div class="container mx-auto flex items-center justify-between p-4">
        <div class="container mx-auto flex items-center justify-between p-4 relative">
            <div class="flex items-center space-x-4">
                <div class="relative h-20 w-[150px]">
                    <img src="media/logo-dark.png" alt="Aura AI Logo" class="absolute inset-0 h-full w-full object-contain" />
                </div>
                <span class="text-white text-base">Aura AI Solutions</span>
            </div>
            <h1 class="text-white font-semibold text-lg absolute left-1/2 -translate-x-1/2">Your Analytics Suite</h1>
            <button id="logout-btn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-white text-sm">Logout</button>
        </div>
    </header>

    <main class="pt-40 px-4 flex justify-center relative z-10">
        <div id="data-table-container" class="w-full max-w-[1600px] h-[80vh] bg-white/10 backdrop-blur-md py-4 px-10 rounded-xl shadow-lg overflow-y-auto">
            <p class="text-white text-center">Loading your analytics data...</p>
        </div>
    </main>

    <div id="update-info-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-lg relative">
            <button id="close-modal-btn" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
            <h2 class="text-2xl font-semibold text-white mb-6 text-center">Request Business Info Update</h2>
            <form id="business-info-form">
                <div class="mb-4">
                    <label for="update-details" class="block text-gray-300 text-sm font-bold mb-2">
                        Please describe the changes you would like to make to your AI's business information:
                    </label>
                    <textarea id="update-details" name="updateDetails" rows="8" 
                              class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-900 leading-tight focus:outline-none focus:shadow-outline bg-gray-700 border-gray-600 focus:ring focus:ring-blue-500/50"
                              placeholder="e.g., 'Update our company address to 123 Main St.', 'Add new service: Product Consulting', 'Remove old contact email: old@example.com'" required></textarea>
                </div>
                <div class="flex items-center justify-between">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-5 rounded focus:outline-none focus:shadow-outline transition duration-300">
                        Send Update Request
                    </button>
                    <p id="form-message" class="text-sm text-gray-400"></p>
                </div>
            </form>
        </div>
    </div>

    <div class="fixed inset-0 -z-10 pointer-events-none">
        <video autoplay loop muted class="w-full h-full object-cover pointer-events-none">
            <source src="media/background.mp4" type="video/mp4" />
            Your browser does not support the video tag.
        </video>

        <img src="media/fallback.jpg" alt="Background" class="absolute inset-0 w-full h-full object-cover block sm:hidden" />
        
        <div class="absolute inset-0 bg-black/60"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwfckZ8iU2XuHqOV-Yp4RG4D9Jwjsw-P8",
            authDomain: "aura-ai-85b65.firebaseapp.com",
            projectId: "aura-ai-85b65",
            storageBucket: "aura-ai-85b65.appspot.com",
            messagingSenderId: "492492484793",
            appId: "1:492492484793:web:7f9038d50f523241536b68"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Protect this page
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            }
        });

        // Logout button
        document.getElementById("logout-btn").addEventListener("click", async () => {
            try {
                await signOut(auth);
                window.location.href = "login.html";
            } catch (err) {
                alert("Logout failed: " + err.message);
            }
        });
    </script>
    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js";

        // IMPORTANT: REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL!
        const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQ_19E4zCMGH1ELYhLj3xVsHt9LUX3FiNIsUk-z--uiSWsgM8XvOTakvIg2V1eiHF5/exec'; 

        const auth = getAuth(); // Get the Firebase Auth instance

        // --- Data Loading Logic ---
        // This function listens for Firebase authentication state changes
        // and loads data when a user is signed in.
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // User is signed in. We can now get their unique ID.
                const userIdentifier = user.uid; // This is the unique Firebase User ID (e.g., k9tY2XzPqL8oN3rJ1sV7uA)
                console.log("Logged-in user ID (Firebase UID):", userIdentifier);

                // Call the function to fetch data using this identifier
                await loadCustomerData(userIdentifier);

            } else {
                // User is signed out. Redirect to login.
                // (Your existing onAuthStateChanged already handles this redirect to login.html)
                console.log("User is signed out. Redirecting to login.");
            }
        });

        // Function to fetch data from the Google Apps Script
        async function loadCustomerData(userIdentifier) {
            const dataTableContainer = document.getElementById('data-table-container');
            if (!dataTableContainer) {
                console.error("Error: Element with ID 'data-table-container' not found.");
                return;
            }

            // Show a loading message while data is being fetched
            dataTableContainer.innerHTML = '<p class="text-white text-center">Loading your analytics data...</p>';

            try {
                // Construct the URL to your Apps Script, including the Firebase User ID
                const response = await fetch(`${GOOGLE_APPS_SCRIPT_URL}?userId=${encodeURIComponent(userIdentifier)}`);
                
                // Check if the network request was successful
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json(); // Parse the JSON response from the Apps Script
                
                // Handle errors returned from the Apps Script itself
                if (data.error) {
                    dataTableContainer.innerHTML = `<p style="color: red; text-align: center;">Error: ${data.error}</p>`;
                    return;
                }
                
                // Check if the received data has the expected structure
                if (typeof data.totalMessagesSent === 'number' && typeof data.monthlyLimit === 'number' &&
                    typeof data.tier === 'string' && typeof data.paymentTerm === 'string' && typeof data.nextPaymentDate === 'string' &&
                    Array.isArray(data.dailyUsageData) && Array.isArray(data.chatLogs)) {

                    const totalSent = data.totalMessagesSent;
                    const monthlyLimit = data.monthlyLimit;
                    const percentageUsed = monthlyLimit > 0 ? Math.min(100, (totalSent / monthlyLimit) * 100) : 0;
                    const progressBarColor = percentageUsed > 90 ? 'bg-red-500' : (percentageUsed > 70 ? 'bg-yellow-500' : 'bg-blue-500');

                    const tier = data.tier;
                    const paymentTerm = data.paymentTerm;
                    const dailyUsageDataReal = data.dailyUsageData; // Real daily usage data
                    const chatLogsReal = data.chatLogs;           // Real chat logs

                    let formattedNextPaymentDate = 'N/A';
                    if (data.nextPaymentDate && data.nextPaymentDate !== 'N/A') {
                        const dateObj = new Date(data.nextPaymentDate);
                        if (!isNaN(dateObj.getTime())) {
                            // Format for UK locale (DD/MM/YYYY)
                            formattedNextPaymentDate = dateObj.toLocaleDateString('en-GB', {
                                year: 'numeric',
                                month: '2-digit',
                                day: '2-digit'
                            });
                        }
                    }
                    
                    // --- Tier Access Logic ---
                    // Tiers: Beta, Essential, Elite, Executive. Elite and Executive have additional features.
                    const hasEliteOrExecutiveAccess = (tier === 'Elite' || tier === 'Executive');

                    // --- Prepare data for charts and chat logs based on access ---
                    let chartLabels = [];
                    let chartData = [];
                    let chatContentHTML = '';

                    if (hasEliteOrExecutiveAccess) {
                        // Use real data for Elite/Executive
                        chartLabels = dailyUsageDataReal.map(item => item.date);
                        chartData = dailyUsageDataReal.map(item => item.count);
                        
                        // Generate HTML for real chat logs
                        if (chatLogsReal.length > 0) {
                            // 👇 ADD .slice().reverse() HERE to ensure messages are reversed before rendering
                            chatLogsReal.slice().reverse().forEach(log => {
                                const messageClass = log.userType.toLowerCase() === 'user' ? 'text-blue-300' : 'text-green-300';
                                const userName = log.userType.toLowerCase() === 'user' ? 'User' : 'AI';
                                // 👇 ADD chat-log-message CLASS HERE (optional for spacing)
                                chatContentHTML += `<p class="mb-2 chat-log-message"><span class="font-bold ${messageClass}">${userName}:</span> ${log.message}</p>`;
                            });
                        } else {
                            chatContentHTML = '<p class="text-gray-400 text-center">No chat logs found for this account.</p>';
                        }

                    } else {
                        // Use example data for Beta/Essential (blurred tiers)
                        // Static example data for blurred graph
                        chartLabels = ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6', 'Day 7'];
                        chartData = [10, 15, 8, 20, 12, 25, 18];

                        // Static example chat log content for blurred display
                        chatContentHTML = `
                            <p class="mb-2 chat-log-message"><span class="font-bold text-green-300">AI:</span> Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.</p>
                            <p class="mb-2 chat-log-message"><span class="font-bold text-blue-300">User:</span> Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p>
                            <p class="mb-2 chat-log-message"><span class="font-bold text-green-300">AI:</span> Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
                            <p class="mb-2 chat-log-message"><span class="font-bold text-blue-300">User:</span> Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                        `;
                    }
                    
                    let displayHTML = `
                        <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6"> 
                        <div class="xl:col-span-2 bg-gray-800 p-6 rounded-lg shadow-xl">
                                <h2 class="text-xl font-semibold text-white mb-4">Monthly Message Usage</h2>
                                <div class="flex items-center justify-between">
                                    <p class="text-gray-300 text-lg">Messages Used:</p>
                                    <p class="text-white text-3xl font-bold">${totalSent} / ${monthlyLimit}</p>
                                </div>
                                <div class="w-full bg-gray-700 rounded-full h-2.5 mt-4">
                                    <div class="${progressBarColor} h-2.5 rounded-full" style="width: ${percentageUsed}%;"></div>
                                </div>
                                <p class="text-gray-400 text-sm mt-2 text-right">Progress towards your monthly limit.</p>
                                ${totalSent >= monthlyLimit ? '<p class="text-red-400 text-sm mt-2 text-center font-bold">You have reached your monthly message limit!</p>' : ''}
                            </div>

                            <div class="xl:col-span-1 bg-gray-800 p-6 rounded-lg shadow-xl">
                                <h2 class="text-xl font-semibold text-white mb-4">Payment Information</h2>
                                <div class="space-y-3">
                                    <div class="flex items-center justify-between">
                                        <p class="text-gray-300">Current Tier:</p>
                                        <p class="text-white font-medium">${tier}</p>
                                    </div>
                                    <div class="flex items-center justify-between">
                                        <p class="text-gray-300">Payment Term:</p>
                                        <p class="text-white font-medium">${paymentTerm}</p>
                                    </div>
                                    <div class="flex items-center justify-between">
                                        <p class="text-gray-300">Next Payment Date:</p>
                                        <p class="text-white font-medium">${formattedNextPaymentDate}</p>
                                    </div>
                                </div>
                            </div>

                            <div class="xl:col-span-1 bg-gray-800 p-6 rounded-lg shadow-xl relative overflow-hidden">
                                <h2 class="text-xl font-semibold text-white mb-4">Daily Message Usage</h2>
                                ${hasEliteOrExecutiveAccess ? `
                                    <div class="h-60">
                                        <canvas id="dailyUsageChart"></canvas>
                                    </div>
                                ` : `
                                    <div class="absolute inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 z-10">
                                        <div class="text-center">
                                            <p class="text-white text-lg font-semibold mb-2">Upgrade to Elite or Executive Tier</p>
                                            <p class="text-gray-300 text-sm">Unlock detailed daily usage analytics.</p>
                                            <a href="https://auraai.uk/frontend/pricing" target="_blank" rel="noopener noreferrer" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded inline-block">Upgrade Now</a>
                                        </div>
                                    </div>
                                    <div class="h-60 opacity-20">
                                        <canvas id="dailyUsageChartDummy"></canvas>
                                    </div>
                                `}
                            </div>

                           <div class="xl:col-span-2 bg-gray-800 p-6 rounded-lg shadow-xl relative overflow-hidden">
                                <h2 class="text-xl font-semibold text-white mb-4">Chat Logs</h2>
                                ${hasEliteOrExecutiveAccess ? `
                                    <div class="text-gray-300 chat-logs-container"> ${chatContentHTML}
                                    </div>
                                ` : `
                                    <div class="absolute inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 z-10">
                                        </div>
                                    <div class="opacity-20 text-gray-300 chat-logs-container"> ${chatContentHTML}
                                    </div>
                                `}
                            </div>

                            <div class="xl:col-span-1 bg-gray-800 p-6 rounded-lg shadow-xl text-center">
                                <h2 class="text-xl font-semibold text-white mb-4">Manage Subscription</h2>
                                <p class="text-gray-400 text-sm mb-4">Need to make a change to your plan?</p>
                                <a href="https://billing.stripe.com/p/login/8x200i8t1eWX9374tn0VO00" style="text-decoration: none;">
                                  <button id="cancel-sub-btn" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg font-medium transition duration-300"> 
                                    Cancel Subscription 
                                  </button> 
                                </a>
                                <p class="text-gray-500 text-xs mt-2">Cancel your subscription through stripe, we are sad to see you go.</p>
                            </div>

                            <div class="xl:col-span-1 bg-gray-800 p-6 rounded-lg shadow-xl text-center">
                                <h2 class="text-xl font-semibold text-white mb-4">Your Feedback</h2>
                                <p class="text-gray-400 text-sm mb-4">Help us improve Aura AI during beta!</p>
                                <a href="https://docs.google.com/forms/d/e/1FAIpQLSde46Maqzo4AOMRIHBSRnqY5F0eeLY38JIUxF-v2_VRIUgBlw/viewform?usp=dialog"
                                   id="feedback-btn"
                                   class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition duration-300 inline-block"
                                   target="_blank"
                                   rel="noopener noreferrer">
                                  Provide Feedback
                                </a>

                                <p class="text-gray-500 text-xs mt-2">Opens a separate feedback form.</p>
                            </div>

                            <div class="xl:col-span-1 bg-gray-800 p-6 rounded-lg shadow-xl text-center">
                                <h2 class="text-xl font-semibold text-white mb-4">Update Business Info</h2>
                                <p class="text-gray-400 text-sm mb-4">Request changes to your AI's knowledge base.</p>
                                <button id="update-info-btn" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-medium transition duration-300">
                                    Request Update
                                </button>
                                <p class="text-gray-500 text-xs mt-2">Sends an update request to our team.</p>
                            </div>
                        </div>`;
                    
                    dataTableContainer.innerHTML = displayHTML; // Display the generated HTML

                    // Initialize Chart.js if user has access (or dummy chart)
                    const chartId = hasEliteOrExecutiveAccess ? 'dailyUsageChart' : 'dailyUsageChartDummy';
                    const ctx = document.getElementById(chartId);

                    if (ctx) { // Ensure canvas element exists
                        new Chart(ctx, {
                            type: 'line', // Line chart for usage over time
                            data: {
                                labels: chartLabels, // Use dynamically set labels
                                datasets: [{
                                    label: 'Messages Sent',
                                    data: chartData, // Use dynamically set data
                                    borderColor: 'rgb(75, 192, 192)',
                                    tension: 0.1,
                                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                    fill: true, // Fill area under the line
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false, // Allow custom height
                                scales: {
                                    y: {
                                        beginAtZero: true,
                                        ticks: { color: hasEliteOrExecutiveAccess ? 'white' : 'rgba(255,255,255,0.3)' },
                                        grid: { color: hasEliteOrExecutiveAccess ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.05)' }
                                    },
                                    x: {
                                        ticks: { color: hasEliteOrExecutiveAccess ? 'white' : 'rgba(255,255,255,0.3)' },
                                        grid: { color: hasEliteOrExecutiveAccess ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.05)' }
                                    }
                                },
                                plugins: {
                                    legend: {
                                        labels: { color: hasEliteOrExecutiveAccess ? 'white' : 'rgba(255,255,255,0.3)' }
                                    }
                                }
                            }
                        });
                    }
                } else {
                    // If the data structure is not what's expected from the Apps Script, show an error
                    dataTableContainer.innerHTML = '<p style="color: red; text-align: center;">Unexpected data format received from analytics server. Please try again later.</p>';
                    console.error("Received unexpected data format:", data);
                }

            } catch (error) {
                console.error('Error fetching or parsing data:', error);
                dataTableContainer.innerHTML = '<p style="color: red; text-align: center;">Failed to load data. Please try again later.</p>';
            }
        }
        // --- NEW: Add functionality for the new buttons ---

        // Get references to buttons and modal elements
        const feedbackBtn = document.getElementById('feedback-btn');
        const updateInfoBtn = document.getElementById('update-info-btn');
        const updateInfoModal = document.getElementById('update-info-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const businessInfoForm = document.getElementById('business-info-form');
        const formMessage = document.getElementById('form-message');
        const updateDetailsTextArea = document.getElementById('update-details');

        // 1. Feedback Button Functionality
        if (feedbackBtn) { // Ensure button exists
            feedbackBtn.addEventListener('click', () => {
                // *** REPLACE THIS URL with your actual Google Form link! ***
                window.open('https://docs.google.com/forms/d/e/1FAIpQLSde46Maqzo4AOMRIHBSRnqY5F0eeLY38JIUxF-v2_VRIUgBlw/viewform?usp=dialog', '_blank');
            });
        }

        // 2. Update Business Info Modal Show/Hide
        if (updateInfoBtn) { // Ensure button exists
            updateInfoBtn.addEventListener('click', () => {
                updateInfoModal.classList.remove('hidden'); // Show the modal
            });
        }

        if (closeModalBtn) { // Ensure button exists
            closeModalBtn.addEventListener('click', () => {
                updateInfoModal.classList.add('hidden'); // Hide the modal
                formMessage.textContent = ''; // Clear any previous messages
                businessInfoForm.reset(); // Reset the form fields
            });
        }

        // Hide modal if clicked outside (optional, but good UX)
        if (updateInfoModal) {
            updateInfoModal.addEventListener('click', (event) => {
                if (event.target === updateInfoModal) { // Check if click was directly on the overlay
                    updateInfoModal.classList.add('hidden');
                    formMessage.textContent = '';
                    businessInfoForm.reset();
                }
            });
        }

        // 3. Update Business Info Form Submission
        if (businessInfoForm) { // Ensure form exists
            businessInfoForm.addEventListener('submit', async (event) => {
                event.preventDefault(); // Prevent default form submission

                formMessage.textContent = 'Sending request...';
                formMessage.className = 'text-sm text-gray-400'; // Reset class

                const requestedChanges = updateDetailsTextArea.value;

                // Get the current user's UID (auth is available from the outer scope)
                const currentUser = auth.currentUser;
                const submitterUserId = currentUser ? currentUser.uid : 'UNKNOWN_USER'; // Fallback if no user is found (shouldn't happen on this protected page)

                if (!requestedChanges.trim()) { // Check if the text area is empty or just whitespace
                    formMessage.textContent = 'Please describe the changes.';
                    formMessage.className = 'text-sm text-red-400';
                    return;
                }

                try {
                    const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                        method: 'POST', // Use POST for submitting data
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded', // Standard form encoding
                        },
                        body: new URLSearchParams({ // Prepare data for POST request
                            action: 'sendBusinessInfoUpdate', // A new 'action' to tell Apps Script what to do
                            userId: submitterUserId,
                            changes: requestedChanges
                        })
                    });

                    const result = await response.json(); // Apps Script will return JSON {success: true/false, error: ...}

                    if (result.success) {
                        formMessage.textContent = 'Request sent successfully! Thank you for your feedback.';
                        formMessage.className = 'text-sm text-green-400';
                        businessInfoForm.reset(); // Clear the form
                        // Optionally, hide the modal after a delay
                        setTimeout(() => updateInfoModal.classList.add('hidden'), 3000);
                    } else {
                        formMessage.textContent = `Error sending request: ${result.error || 'Unknown error'}`;
                        formMessage.className = 'text-sm text-red-400';
                    }
                } catch (error) {
                    console.error('Error submitting business info update:', error);
                    formMessage.textContent = 'Failed to send request. Please try again later.';
                    formMessage.className = 'text-sm text-red-400';
                }
            });
        }
    </script>
</body>
</html>
