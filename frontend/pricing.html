<script src="https://js.stripe.com/v3/"></script>
<script>
  const stripe = Stripe('pk_test_51RPZ7YCOIG8iILAlIkl1sFKlwAOwt4dJNxKg8rO8Mebv7SG9bR36IZUyp5ZfhWyFlzHZW226ZU7Om3wiMfeOPQZD00jlw3BVBn'); 

  document.getElementById('checkout-button').addEventListener('click', function () {
    const isYearly = document.getElementById('billing-toggle').checked;

    const billingType = isYearly ? 'annual' : 'monthly';
    console.log('Billing Type Sent:', billingType);
    fetch(`https://charismatic-nourishment-production.up.railway.app/create-checkout-session`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ plan: billingType })
    })
    .then(response => response.json())
    .then(session => stripe.redirectToCheckout({ sessionId: session.id }))
    .catch(error => console.error('Stripe error:', error));
  });
</script>
